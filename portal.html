<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.top{display:flex;align-items:center;gap:12px;min-height:64px}

.lang button{border:0;background:none;color:var(--ink-2);padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}

.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;margin-inline-start:6px;padding:0 6px}
main{padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}

.note{color:var(--ink-3);font-size:13px;margin:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}

.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:12px;margin-top:12px}

.lbl{font-size:12px;color:var(--ink-3);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{position:relative;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:crosshair}
.shot img,.shot video{display:block;width:100%;height:auto}
.shot.video{cursor:default}
.before .shot{cursor:default;opacity:.85}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin.draft{background:var(--accent);color:var(--accent-ink)}
.pin.done{background:var(--ink-3)}
.copy{font-size:13.5px;color:var(--ink-2);margin-top:10px;display:grid;gap:4px}
.copy b{color:var(--ink)}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
label.f{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.comments{display:grid;gap:8px;margin-top:12px}
.cm{border-inline-start:3px solid var(--line);padding:4px 10px;font-size:13.5px}
.cm.open{border-color:var(--bad)}
.cm small{color:var(--ink-3)}
.drafts{display:grid;gap:6px;margin-top:8px}
.draft{display:flex;gap:8px;align-items:center}
.draft span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--ink-3);padding:40px 16px}
.err{color:var(--bad);font-size:13.5px}
.ok{color:var(--good);font-size:13.5px}

    else details+='<div class="card"><span class="lbl">'+t('room_task')+' · '+esc(task.language.toUpperCase())+'</span><p dir="auto">'+esc([task.original.text].concat((task.original.pins||[]).map(function(p){return p.text;})).filter(Boolean).join(' · '))+'</p><span class="tag">'+esc(task.status==='resolved'?t('room_approved'):task.status==='submitted'?t('room_review'):t('room_changes'))+'</span>'+(task.reply?'<p dir="auto"><b>'+t('room_reply')+':</b> '+esc(task.reply)+'</p>':'')+'</div>';
  });
  var frame=product.frames.find(function(f){return (f.revisionId||f.slotId+':'+f.language)===roomFrame;})||product.frames.find(function(f){return f.status==='pending';})||product.frames[0];roomFrame=frame&&(frame.revisionId||frame.slotId+':'+frame.language);
  details+='<div class="room-film">'+product.frames.map(function(f){return '<button type="button" class="btn" data-room-frame="'+(f.revisionId||f.slotId+':'+f.language)+'" aria-pressed="'+(frame===f)+'">'+esc(f.name)+' · '+esc(f.language==='none'?(lang==='ar'?'مشترك':'Shared'):f.language.toUpperCase())+' · '+(f.status==='approved'?'✓':f.status==='pending'?t('room_review'):t('room_in_progress'))+'</button>';}).join('')+'</div>';
  var saved=data.reviews;
  data.reviews=saved.map(function(r){return Object.assign({},r,{items:r.items.filter(function(it){return frame&&frame.reviewId===r.id&&frame.revisionId===it.creator?.revisionId;})});}).filter(function(r){return r.items.length;});
  // Keep original indices: old event handlers address review item positions.
  data.reviews.forEach(function(r){r.items=r.items.map(function(it){return Object.assign({},it,{_roomIndex:saved.find(function(old){return old.id===r.id;}).items.findIndex(function(old){return old.key===it.key;})});});});
  var originalFlat=flatReviews();
  data.reviews=saved;
  details+=originalFlat;
  product.frames.filter(function(f){return f===frame&&!f.reviewId;}).forEach(function(f){details+='<div class="card"><b>'+esc(f.name)+' · '+esc(f.language.toUpperCase())+'</b><p class="note">'+t('room_in_progress')+'</p></div>';});
  return head+details+'</section></div>';
};
document.addEventListener('change',function(e){var el=e.target;if(el.id==='room-batch'){roomBatch=el.value;roomProduct=null;roomFrame=null;roomSelections={};roomError='';render();}if(el.dataset.roomSelect){var batch=(data.room.batches||[]).find(function(b){return b.id===roomBatch;}),p=batch.items.find(function(p){return p.projectId===el.dataset.roomSelect;});if(el.checked)roomSelections[p.projectId]={projectId:p.projectId,revisionIds:p.frames.map(function(f){return f.revisionId;})};else delete roomSelections[p.projectId];render();}});
document.addEventListener('click',function(e){var el=e.target.closest('[data-room-product]');if(el){roomProduct=el.dataset.roomProduct;roomFrame=null;return render();}var frame=e.target.closest('[data-room-frame]');if(frame){roomFrame=frame.dataset.roomFrame;return render();}if(e.target.closest('#room-refresh')){roomError='';return load();}
  var answer=e.target.closest('[data-room-send-answer]');if(!answer&&!e.target.closest('#room-approve'))return;if(roomBusy)return;var body=answer?{action:'answer',batchId:roomBatch,taskId:answer.dataset.roomSendAnswer,answer:document.querySelector('[data-room-answer="'+answer.dataset.roomSendAnswer+'"]').value}:{action:'approve',batchId:roomBatch,selections:Object.values(roomSelections),approver:approver(),name:name()};
  roomBusy=true;roomError='';render();send('/batches','POST',body).then(function(){roomSelections={};return load();}).catch(function(err){roomError=err.message;}).then(function(){roomBusy=false;render();});
});

document.addEventListener('click',function(e){if(!e.target.closest('#room-download')||roomBusy)return;var b=data.room.batches.find(function(b){return b.id===roomBatch;});roomBusy=true;roomError='';render();fetch('/api/c/'+token+'/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'export',batchId:b.id,projectIds:b.items.filter(function(p){return p.ready;}).map(function(p){return p.projectId;})})}).then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.error);});return r.blob();}).then(function(blob){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='approved-content.zip';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);}).catch(function(e){roomError=e.message;}).then(function(){roomBusy=false;render();});});

function opText(en,ar){return lang==='ar'?ar:en;}
var opChoices={},opNames={},opNotes={},opError='',opBusy=false;
function opStatus(s){var labels={sent:['Awaiting your choice','بانتظار اختيارك'],accepted:['Scope approved','النطاق معتمد'],pending:['Awaiting your approval','بانتظار اعتمادك'],approved:['Direction approved','الاتجاه معتمد'],changes:['Changes requested','طُلب تعديل'],needs_refresh:['Agency is updating the sample','الوكالة تحدث النموذج']};return labels[s]?opText(labels[s][0],labels[s][1]):s;}
function opMoney(v,c){return (v/100).toLocaleString(lang==='ar'?'ar-AE':'en-AE',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+c;}
function opOperations(){var ops=data.operations||{},offers=ops.offers||[],directions=ops.directions||[];if(!offers.length&&!directions.length)return '';return '<div class="op-workspace">'+(opError?'<p class="err" role="alert">'+esc(opError)+'</p>':'')+directions.map(function(d){return '<section class="card op-direction"><span class="lbl">'+opText('Creative direction · before production','الاتجاه الإبداعي · قبل الإنتاج')+'</span><div class="row"><h2>'+esc(d.batchName)+'</h2><span class="tag">'+esc(opStatus(d.status))+'</span></div><p dir="auto">'+esc(d.note)+'</p><div class="op-samples">'+d.items.map(function(i){return '<div>'+mediaHTML(i.asset.url)+'<small>'+esc(i.name)+' · '+esc(i.language==='bilingual'?'EN + AR':i.language==='none'?opText('Shared','مشترك'):i.language.toUpperCase())+'</small></div>';}).join('')+'</div>'+(d.status==='pending'?'<label class="f">'+opText('Your name','اسمك')+'<input data-op-name="'+d.id+'" value="'+esc(opNames[d.id]||name())+'"></label><label class="f">'+opText('Feedback · required for changes','ملاحظات · مطلوبة للتعديل')+'<textarea data-op-note="'+d.id+'">'+esc(opNotes[d.id]||'')+'</textarea></label><div class="row"><button class="btn primary" data-op-direction="'+d.id+'" data-batch="'+d.batchId+'" data-decision="approve"'+(opBusy?' disabled':'')+'>'+opText('Approve this direction','اعتماد هذا الاتجاه')+'</button><button class="btn" data-op-direction="'+d.id+'" data-batch="'+d.batchId+'" data-decision="changes"'+(opBusy?' disabled':'')+'>'+opText('Request changes','طلب تعديلات')+'</button></div>':'<p class="note">'+opText(d.status==='needs_refresh'?'The source facts or sample changed. The agency must submit a current direction.':'This direction decision is saved for the batch.',d.status==='needs_refresh'?'تغيرت الحقائق أو النموذج. يجب أن ترسل الوكالة اتجاهاً محدثاً.':'حُفظ قرار الاتجاه لهذه الدفعة.')+'</p>')+'</section>';}).join('')+offers.map(function(o){var key=o.id+':'+o.version;if(!opChoices[key])opChoices[key]=Object.fromEntries(o.lines.map(function(l){return [l.id,true];}));var choices=opChoices[key],total=o.lines.filter(function(l){return choices[l.id];}).reduce(function(n,l){return n+l.price;},0);return '<section class="card op-offer"><span class="lbl">'+opText('Agency service proposal','عرض خدمات الوكالة')+'</span><div class="row"><h2>'+esc(o.title)+'</h2><span class="tag">'+esc(opStatus(o.status))+'</span></div><p class="note">'+opText('Choose the work you want the agency to prepare. Prices are agency service fees. Payment is handled separately.','اختر العمل المطلوب من الوكالة. الأسعار رسوم خدمات الوكالة، والدفع يتم بشكل منفصل.')+'</p><div class="op-lines">'+o.lines.map(function(l){return '<label><input type="checkbox" data-op-line="'+l.id+'" data-offer-key="'+key+'"'+((o.status==='accepted'?o.acceptance.lineIds.includes(l.id):choices[l.id])?' checked':'')+(o.status==='accepted'?' disabled':'')+'><span><b>'+esc(l.productName)+'</b><small>'+esc(lang==='ar'?l.titleAr:l.title)+'</small></span><strong>'+opMoney(l.price,o.currency)+'</strong></label>';}).join('')+'</div><p dir="auto">'+esc(o.notes||'')+'</p><p class="op-total">'+opText('Selected scope','النطاق المحدد')+': <b>'+opMoney(o.acceptance?.total??total,o.currency)+'</b></p>'+(o.status==='sent'?'<label class="f">'+opText('Your name','اسمك')+'<input data-op-name="'+o.id+'" value="'+esc(opNames[o.id]||name())+'"></label><label class="op-confirm"><input type="checkbox" data-op-confirm="'+o.id+'">'+opText('I reviewed the selected services, prices and proposal notes.','راجعت الخدمات المحددة والأسعار وملاحظات العرض.')+'</label><button class="btn primary" data-op-accept="'+o.id+'" data-version="'+o.version+'" disabled>'+opText('Approve selected scope','اعتماد النطاق المحدد')+'</button>':'<p class="note">✓ '+opText('Approved scope is saved. Your agency will prepare the work in a delivery batch.','حُفظ النطاق المعتمد. ستجهز الوكالة العمل في دفعة تسليم.')+'</p>')+'</section>';}).join('')+'</div>';}
var opReviewsBase=vReviews;
vReviews=function(){return opOperations()+opReviewsBase();};
var opFlatBase=flatReviews;
flatReviews=function(){var html=opFlatBase(),stale=new Set(data.operations?.staleRevisionIds||[]);if(!stale.size)return html;var t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('[data-k]').forEach(function(section){var key=section.dataset.k.split(':'),review=data.reviews.find(function(r){return r.id===key[0];}),item=review?.items.find(function(it,i){return (it._roomIndex??i)===Number(key[1]);});if(item?.creator&&stale.has(item.creator.revisionId)){section.insertAdjacentHTML('afterbegin','<p class="err">'+opText('Product facts changed. This file is retained in history; wait for an updated version.','تغيرت حقائق المنتج. يبقى الملف في السجل؛ انتظر النسخة المحدثة.')+'</p>');section.querySelectorAll('[data-act]').forEach(function(b){b.disabled=true;});}});return t.innerHTML;};
document.addEventListener('input',function(e){var el=e.target;if(el.dataset.opName)opNames[el.dataset.opName]=el.value;if(el.dataset.opNote)opNotes[el.dataset.opNote]=el.value;});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset.opLine){opChoices[el.dataset.offerKey][el.dataset.opLine]=el.checked;render();}if(el.dataset.opConfirm){var b=document.querySelector('[data-op-accept="'+el.dataset.opConfirm+'"]');if(b)b.disabled=!el.checked||opBusy;}});
document.addEventListener('click',function(e){var el=e.target.closest('[data-op-accept],[data-op-direction]');if(!el||opBusy)return;var body;if(el.dataset.opAccept){var o=data.operations.offers.find(function(o){return o.id===el.dataset.opAccept;}),key=o.id+':'+o.version;body={action:'offer_accept',offerId:o.id,version:o.version,lineIds:o.lines.filter(function(l){return opChoices[key][l.id];}).map(function(l){return l.id;}),name:opNames[o.id]||name(),confirm:true};}else body={action:'direction_decide',batchId:el.dataset.batch,directionId:el.dataset.opDirection,decision:el.dataset.decision,name:opNames[el.dataset.opDirection]||name(),comment:opNotes[el.dataset.opDirection]||''};opBusy=true;opError='';render();send('/agency','POST',body).then(load).catch(function(e){opError=e.message;}).finally(function(){opBusy=false;render();});});
// Make a bound field explicit in the existing question card.
var opRoomReviews=vReviews;
vReviews=function(){var t=document.createElement('template');t.innerHTML=opRoomReviews();(data.room?.batches||[]).forEach(function(b){b.items.forEach(function(p){if(p.projectId===roomProduct&&p.frames.some(function(f){return f.factStale;}))t.content.querySelector('.room-layout>section')?.insertAdjacentHTML('afterbegin','<p class="op-field">'+opText('The agency is updating versions affected by changed product data. Previous approvals remain in history.','تحدث الوكالة النسخ المتأثرة بتغيير بيانات المنتج. تبقى الاعتمادات السابقة في السجل.')+'</p>');p.tasks.filter(function(t){return t.kind==='data'&&t.field;}).forEach(function(task){var input=t.content.querySelector('[data-room-answer="'+task.id+'"]');if(input){input.insertAdjacentHTML('beforebegin','<p class="op-field"><b>'+esc(task.field.label)+'</b> · '+esc(task.field.unit||'')+'<br><small>'+opText(task.field.type==='json'?'Supply complete JSON rows using your actual product data. Ask your agency if you need help.':task.field.type==='lines'?'Enter one confirmed item or step per line. The agency reviews your answer.':'Enter the actual value in this unit. The agency checks it before updating product data.',task.field.type==='json'?'أدخل صفوف JSON كاملة ببيانات منتجك الفعلية. اطلب مساعدة الوكالة عند الحاجة.':task.field.type==='lines'?'أدخل عنصراً أو خطوة مؤكدة في كل سطر. تراجع الوكالة إجابتك.':'أدخل القيمة الفعلية بهذه الوحدة. تراجعها الوكالة قبل تحديث بيانات المنتج.')+'</small></p>');if(task.field.type==='number')input.setAttribute('inputmode','decimal');}});});});return t.innerHTML;};

var opLibraryBase=vLibrary;
vLibrary=function(){var html=opLibraryBase(),old=data.operations?.archivedLibrary||[];if(!old.length)return html;return html+'<details class="card"><summary>'+opText('Historical files · outdated product facts','ملفات سابقة · حقائق منتج قديمة')+' ('+old.length+')</summary><p class="note">'+opText('Kept for history. These files are excluded from current approved delivery.','محفوظة للسجل، ومستبعدة من التسليم المعتمد الحالي.')+'</p>'+old.map(function(x){return '<p><b>'+esc(x.name)+'</b></p>';}).join('')+'</details>';};

setLang(lang); load();
})();
