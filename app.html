<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Basira App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Readex+Pro:wght@300..700&family=Reem+Kufi:wght@500..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell with a quiet sidebar and one working canvas; same oasis palette as the site,
   state carried by chips and score bars so problems read at a glance. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EEEB; --line:#D6DFDA;
  --ink:#0C1A17; --ink-2:#4A5A55; --ink-3:#7A8A85;
  --brand:#0B5D52; --brand-soft:#DAEBE6; --on-brand:#FFFFFF;
  --saffron:#C8771E; --saffron-ink:#94540F; --saffron-soft:#F6E7D3;
  --bad:#B93A26; --bad-soft:#F6E1DC; --good:#1D7A4C; --good-soft:#DBEFE3;
  --side:#0C1A17; --side-ink:#C9D6D1; --side-ink-2:#7F918B; --side-hi:#1A2B27;
  --shadow:0 1px 2px rgba(12,26,23,.06),0 10px 30px -12px rgba(12,26,23,.16);
  --font-display:"Bricolage Grotesque","Readex Pro",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Readex Pro",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1210; --surface:#101B18; --surface-2:#16231F; --line:#22322D;
  --ink:#E7EFEC; --ink-2:#A2B2AC; --ink-3:#71827C;
  --brand:#52C4AE; --brand-soft:#123129; --on-brand:#04120F;
  --saffron:#EBA24C; --saffron-ink:#F2B86B; --saffron-soft:#33230F;
  --bad:#F08A73; --bad-soft:#3A1B15; --good:#62D293; --good-soft:#11301F;
  --side:#060C0B; --side-ink:#C9D6D1; --side-ink-2:#6F817B; --side-hi:#13211D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1210; --surface:#101B18; --surface-2:#16231F; --line:#22322D;
  --ink:#E7EFEC; --ink-2:#A2B2AC; --ink-3:#71827C;
  --brand:#52C4AE; --brand-soft:#123129; --on-brand:#04120F;
  --saffron:#EBA24C; --saffron-ink:#F2B86B; --saffron-soft:#33230F;
  --bad:#F08A73; --bad-soft:#3A1B15; --good:#62D293; --good-soft:#11301F;
  --side:#060C0B; --side-ink:#C9D6D1; --side-ink-2:#6F817B; --side-hi:#13211D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px -14px rgba(0,0,0,.6);
  color-scheme:dark}
html[lang="ar"]{--font-display:"Reem Kufi","Readex Pro",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0;line-height:1.35}
p{margin:0}
.tnum,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.flip{transition:transform .2s}[dir="rtl"] .flip{transform:scaleX(-1)}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh;padding-left:max(14px,env(safe-area-inset-left,0px))}
[dir="rtl"] .side{padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;color:#fff;text-decoration:none}
.brand svg{width:28px;height:28px}
.brand small{font-family:"Readex Pro",sans-serif;font-weight:400;font-size:13px;color:var(--side-ink-2)}
.ws{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side-hi)}
.ws i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7A3E9D,#C0508A);flex:none}
.ws b{display:block;color:#fff;font-weight:500;font-size:14px}
.ws small{color:var(--side-ink-2);font-size:12px}
.navl{display:grid;gap:2px}
.navl a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--side-ink);font-size:14.5px}
.navl a svg{width:18px;height:18px;opacity:.8;flex:none}
.navl a:hover{background:var(--side-hi)}
.navl a[aria-current="page"]{background:var(--side-hi);color:#fff}
.navl a[aria-current="page"] svg{opacity:1;color:var(--saffron)}
.navl .cnt{margin-inline-start:auto;font-size:11.5px;background:var(--saffron);color:#1b1004;border-radius:999px;padding:1px 8px;font-weight:500}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12.5px;color:var(--side-ink-2)}
.credits{background:var(--side-hi);border-radius:12px;padding:12px;display:grid;gap:8px}
.credits .tr{height:6px;border-radius:6px;background:#22332E;overflow:hidden}
.credits .tr i{display:block;height:100%;width:62%;background:var(--saffron)}
.credits b{color:#fff;font-weight:500}
.side-foot a{color:var(--side-ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;height:38px;padding-inline:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;height:28px;min-width:38px;padding-inline:8px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--saffron-soft);color:var(--saffron-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.view{padding:28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:22px;max-width:1320px;width:100%}
.mobile-nav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none}
  .mobile-nav a{flex:none;text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
  .mobile-nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .top{padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .avatar{display:none}
}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:clamp(24px,2.6vw,32px);font-weight:700}
.head p{color:var(--ink-2);margin-top:4px}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);text-decoration:none;font-size:13px;margin-bottom:6px}
.crumb svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-family:var(--font-body);font-weight:600;letter-spacing:0}
.card-h small{color:var(--ink-3);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding-inline:16px;border-radius:10px;border:1px solid transparent;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:filter .15s,background .15s}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:32px;padding-inline:12px;font-size:13px;border-radius:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--saffron-soft);color:var(--saffron-ink)}.tag.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.kpi small{color:var(--ink-3);font-size:12.5px}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi .up{color:var(--good)}
@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
@media (max-width:1050px){.grid2,.grid2.even{grid-template-columns:1fr}}

.pthumb{width:40px;height:48px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.pthumb svg{width:64%;height:auto}
.pcell{display:flex;align-items:center;gap:12px;min-width:0}
.pcell b{display:block;font-weight:500;line-height:1.3}
.pcell small{color:var(--ink-3);font-size:12px;font-family:var(--font-mono)}
.sbar{display:inline-flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-weight:500}
.sbar i{display:block;width:80px;height:6px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.sbar i::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);background:var(--c);border-radius:6px;transition:width .8s}
.list{display:grid}
.row-link{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-decoration:none}
.row-link:first-child{border-top:0}
.row-link:hover{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.hbar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;padding-block:7px;font-size:13.5px}
.hbar .tr{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:9px}
.chan-mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;font-size:11px}
.chans{display:inline-flex;gap:4px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding-inline:12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding-inline:10px;font-size:13px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:780px}
th{font-weight:500;font-size:12px;color:var(--ink-3);text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* listing */
.lhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--c);stroke-linecap:round;stroke-dasharray:213.6;transition:stroke-dashoffset 1s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:26px;font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gimg{aspect-ratio:4/5;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden}
.gimg svg{width:56%}
.gimg.missing{border:1.5px dashed var(--line);background:transparent;color:var(--ink-3);font-size:12px;text-align:center;padding:8px}
.gimg .flag{position:absolute;top:6px;inset-inline-start:6px}
.issue{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
.issue .sev{align-self:stretch;border-radius:4px;background:var(--c)}
.issue b{font-weight:500;display:block}
.issue p{color:var(--ink-2);font-size:13px;margin-top:2px}
.quote{padding:12px 14px;border-radius:12px;background:var(--surface-2);display:grid;gap:6px}
.quote q{quotes:none;direction:rtl;text-align:right;font-size:15px}
.quote q.en{direction:ltr;text-align:left}
.quote .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}

/* studio */
.studio{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:1180px){.studio{grid-template-columns:minmax(0,1fr) 320px}.slist{grid-column:1/-1;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}}
@media (max-width:760px){.studio{grid-template-columns:1fr}}
.slist{display:grid;gap:10px;align-content:start}
.sitem{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start}
.sitem[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sitem .mini{width:52px;aspect-ratio:4/5;border-radius:7px;overflow:hidden}
.sitem b{display:block;font-size:13px;font-weight:500}
.sitem small{font-size:11.5px;color:var(--ink-3)}
@media (max-width:560px){.sitem{grid-template-columns:1fr}.sitem .mini{width:100%}.sitem small{display:none}}
.stage{background:var(--surface-2);border-radius:18px;padding:28px;display:grid;place-items:center;gap:14px;border:1px solid var(--line)}
.canvas{width:min(100%,400px);aspect-ratio:4/5;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);container-type:inline-size}
.canvas .prod{position:absolute;inset:0;display:grid;place-items:center}
.canvas .prod svg{width:46%;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25))}
.canvas .txt{position:absolute;inset-inline:7%;display:grid;gap:2cqw}
.canvas .hd{font-family:"Reem Kufi","Readex Pro",sans-serif;font-size:10.5cqw;line-height:1.15;font-weight:600}
.canvas .hd.en{font-family:"Bricolage Grotesque",sans-serif;font-size:8.5cqw;letter-spacing:-.02em;line-height:1.05;font-weight:700}
.canvas .sub{font-size:4.2cqw;opacity:.85}
.canvas ul{list-style:none;margin:0;padding:0;display:grid;gap:2.4cqw;font-size:4.6cqw}
.canvas ul li{display:flex;gap:2.5cqw;align-items:center}
.canvas ul li::before{content:"";width:2cqw;height:2cqw;transform:rotate(45deg);background:currentColor;flex:none}
.canvas .logo{position:absolute;top:5%;inset-inline-end:6%;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:3.6cqw;letter-spacing:.2em;opacity:.8}
.canvas .scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(82,196,174,.0) 40%,rgba(82,196,174,.35) 50%,transparent 60%);background-size:100% 220%;animation:scan 1.2s linear infinite;pointer-events:none}
@keyframes scan{from{background-position:0 120%}to{background-position:0 -120%}}
.stage-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.canvas .prod img{width:62%;height:70%;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25))}
.sitem .canvas .prod img,.ba .canvas .prod img{filter:none}
.renders{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.renders a{display:grid;gap:6px;text-decoration:none;font-size:12.5px;color:var(--ink-2)}
.renders img{width:100%;aspect-ratio:4/5;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2)}
@media (max-width:560px){.renders{grid-template-columns:1fr 1fr}}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file input{font-size:12.5px;max-width:100%}
.note{font-size:12.5px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.field select{height:38px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding-inline:10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.audit-grid{grid-template-columns:1.1fr 1fr}
.audit-out{display:grid;gap:16px;position:sticky;top:80px;min-width:0}
@media (max-width:1050px){.audit-grid{grid-template-columns:1fr}.audit-out{position:static}}
.dialects{display:flex;flex-wrap:wrap;gap:6px}
.fix{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--brand-soft)}
.fix .ar{direction:rtl;text-align:right}
.pv{display:block;width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2)}
.pv.big{border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.stage-box{position:relative;width:min(100%,420px)}
.stage-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sitem .mini .pv{border-radius:6px}
.tpl-name{display:grid;gap:2px;padding-top:4px;border-top:1px solid var(--line);padding-top:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.tcard{display:grid;gap:10px;align-content:start}
.tcard.dim .pv{opacity:.55}

.field{display:grid;gap:6px}

.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;outline:none;width:100%;min-width:0;resize:vertical}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{display:flex;gap:8px;flex-wrap:wrap}

.steps{display:grid;gap:8px;font-size:13px}

.steps div i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}

function openIssues(p){ return p.fixed ? [] : p.issues; }
function arrow(){ return '<svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'; }
function backArrow(){ return '<svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>'; }
var toastTimer;
function toast(msg){ var el = document.getElementById("toast"); document.getElementById("toast-t").textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2600); }
function go(hash){ if (location.hash === "#"+hash) route(); else location.hash = hash; }

/* ---------- views ---------- */
function vOverview(){
  var avg = Math.round(P.reduce(function(a,p){ return a+p.score; },0)/P.length);
  var low = P.filter(function(p){ return p.score < 60; }).length;
  var pend = state.queue.filter(function(q){ return q.status === "pending"; }).length;
  var revs = P.reduce(function(a,p){ return a+p.rev; },0);
  var agg = {}; P.forEach(function(p){ p.themes.forEach(function(th){ if (!th[2]) agg[th[0]] = (agg[th[0]]||0) + th[1]*p.rev; }); });
  var tot = Object.keys(agg).reduce(function(a,k){ return a+agg[k]; },0);
  var top = Object.keys(agg).map(function(k){ return [k, Math.round(agg[k]/tot*100)]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
  var maxT = top.length ? top[0][1] : 1;
  var first = P.slice().sort(function(a,b){ return a.score-b.score; }).slice(0,4);
  var chs = Object.keys(CH).map(function(c){ var ps = P.filter(function(p){ return p.ch.indexOf(c) > -1; }); return [c, Math.round(ps.reduce(function(a,p){ return a+p.score; },0)/ps.length), ps.length]; });

  '<div class="kpis">'+
    '<div class="kpi"><small>'+t("avgScore")+'</small><b>'+avg+'</b><span><span class="up">+9</span> '+t("vsLast")+'</span></div>'+
    '<div class="kpi"><small>'+t("needFix")+'</small><b>'+low+'</b><span>/ '+P.length+'</span></div>'+
    '<div class="kpi"><small>'+t("pending")+'</small><b>'+pend+'</b><span><a href="#approvals">'+t("approvals")+'</a></span></div>'+
    '<div class="kpi"><small>'+t("analyzed")+'</small><b>'+revs.toLocaleString("en")+'</b><span>'+t("dialects5")+'</span></div>'+
  '</div>'+
  '<div class="grid2">'+
    '<div class="card"><div class="card-h"><h2>'+t("fixFirst")+'</h2><small>'+t("fixFirstSub")+'</small></div><div class="list">'+
      first.map(function(p){ var is = openIssues(p); return '<a class="row-link" href="#listing-'+p.id+'"><span class="pcell"><span class="pthumb">'+thumb(p)+'</span><span style="min-width:0"><b>'+esc(tr(p.name))+'</b>'+(is.length ? '<span class="tag '+(ISSUES[is[0]].sev === "high" ? "bad" : "warn")+'">'+tr(ISSUES[is[0]].t)+'</span>' : '<span class="tag good">'+t("healthy")+'</span>')+'</span></span>'+sbar(p.score)+arrow()+'</a>'; }).join("")+
    '</div></div>'+
    '<div style="display:grid;gap:18px">'+
      '<div class="card"><div class="card-h"><h2>'+t("themes")+'</h2><small>'+t("themesSub")+'</small></div>'+
        top.map(function(x){ return '<div class="hbar"><span>'+tr(THEMES[x[0]])+'</span><span class="tr"><i style="--w:'+Math.round(x[1]/maxT*100)+'%;--c:var(--bad)"></i></span><span class="mono">'+x[1]+'%</span></div>'; }).join("")+
      '</div>'+
      '<div class="card"><div class="card-h"><h2>'+t("chanHealth")+'</h2></div>'+
        chs.map(function(c){ var x = CH[c[0]]; return '<div class="hbar" style="grid-template-columns:150px 1fr 44px"><span style="display:flex;gap:8px;align-items:center"><span class="chan-mk" style="background:'+x.bg+';color:'+x.fg+'">'+x.m+'</span>'+x.n+'</span><span class="tr"><i style="--w:'+c[1]+'%;--c:'+scoreColor(c[1])+'"></i></span><span class="mono">'+c[1]+'</span></div>'; }).join("")+
      '</div>'+
    '</div>'+
  '</div>';
}

function vCatalog(){
  var q = state.q.trim().toLowerCase();

    if (state.src === "imported" && !p.imported) return false;

    if (q && (p.name[0]+" "+p.name[1]+" "+p.sku).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a,b){ return state.sort === "score" ? a.score-b.score : state.sort === "reviews" ? b.rev-a.rev : tr(a.name).localeCompare(tr(b.name)); });
  return '<div class="head"><div><h1>'+t("catalog")+'</h1><p>'+P.length+' · Noon, Amazon, Salla, Zid, Shopify</p></div></div>'+
  importCard()+
  '<div class="toolbar">'+(nImp ? '<div class="chips" role="group">'+["all","imported","sample"].map(function(k){ return '<button type="button" class="chip" data-src="'+k+'" aria-pressed="'+(state.src === k)+'">'+t("src_"+k)+(k === "imported" ? " · "+nImp : "")+'</button>'; }).join("")+'</div>' : "")+'<div class="chips" role="group">'+
    ["all"].concat(Object.keys(CH)).map(function(c){ return '<button type="button" class="chip" data-chan="'+c+'" aria-pressed="'+(state.chan === c)+'">'+(c === "all" ? t("all") : CH[c].n)+'</button>'; }).join("")+
  '</div><select class="sel" id="sort" aria-label="Sort" style="margin-inline-start:auto"><option value="score"'+(state.sort === "score" ? " selected" : "")+'>'+t("sortScore")+'</option><option value="reviews"'+(state.sort === "reviews" ? " selected" : "")+'>'+t("sortReviews")+'</option><option value="name"'+(state.sort === "name" ? " selected" : "")+'>'+t("sortName")+'</option></select></div>'+
  '<div class="tbl-wrap"><table><thead><tr><th>'+t("thProduct")+'</th><th>'+t("thChannels")+'</th><th>'+t("thScore")+'</th><th>'+t("thTop")+'</th><th>'+t("thIssues")+'</th><th>'+t("thRating")+'</th><th></th></tr></thead><tbody>'+
  (rows.length ? rows.map(function(p){ var is = openIssues(p); var top = is[0] ? (ISSUES[is[0]] || {sev:"med", t:[is[0], is[0]]}) : null;
    return '<tr data-href="listing-'+p.id+'" tabindex="0"><td><span class="pcell"><span class="pthumb">'+thumb(p)+'</span><span style="min-width:0"><b>'+esc(tr(p.name))+'</b><small>'+esc(p.sku)+'</small>'+(p.imported ? ' <span class="tag brand">'+t("importedTag")+'</span>' : "")+'</span></span></td><td>'+chans(p)+'</td><td>'+sbar(p.score)+'</td><td>'+(top ? '<span class="tag '+(top.sev === "high" ? "bad" : top.sev === "med" ? "warn" : "")+'">'+tr(top.t)+'</span>' : '<span class="tag good">'+t("healthy")+'</span>')+'</td><td class="tnum">'+is.length+'</td><td class="tnum">'+(p.rating ? '★ '+p.rating.toFixed(1)+' <span style="color:var(--ink-3)">('+p.rev+')</span>' : '<span style="color:var(--ink-3)">—</span>')+'</td><td>'+arrow()+'</td></tr>'; }).join("")
  : '<tr><td colspan="7" class="empty">'+t("noResults")+'</td></tr>')+
  '</tbody></table></div>';

function ring(s){ var off = 213.6*(1-s/100); return '<div class="ring" style="--c:'+scoreColor(s)+'"><svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="val" cx="40" cy="40" r="34" style="stroke-dashoffset:'+off+'"/></svg><b>'+s+'</b></div>'; }
function vListing(){

  '<a class="btn btn-primary" href="#studio-'+p.id+'">'+t("genFix")+arrow()+'</a></div></div>'+
  '<div class="grid2">'+
    '<div style="display:grid;gap:18px">'+
      '<div class="card"><div class="card-h"><h2>'+t("gallery")+'</h2><small>'+(p.fixed ? 4 : p.imgs)+' / 7</small></div><div class="gallery">'+slots.join("")+'</div></div>'+
      '<div class="card"><div class="card-h"><h2>'+t("issuesT")+'</h2><small>'+is.length+'</small></div>'+
        (is.length ? is.map(function(k, n){ var x = ISSUES[k] || {sev:"med", slide:1, t:[k,k], d:["",""]}; var dt = details && details[n] && details[n].key === k ? details[n] : null; return '<div class="issue" style="--c:'+sevC(dt ? dt.sev : x.sev)+'"><span class="sev"></span><div><b>'+tr(x.t)+'</b><p>'+esc(dt ? issueDetail(dt) : tr(x.d))+'</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">'+sevTag(x.sev)+'<a class="btn btn-ghost btn-sm" href="#studio-'+p.id+'" data-slide="'+x.slide+'">'+t("fixInStudio")+'</a></div></div>'; }).join("") : '<p class="empty">'+t("noIssues")+'</p>')+
      '</div>'+
    '</div>'+
    '<div style="display:grid;gap:18px">'+
      '<div class="card"><div class="card-h"><h2>'+t("breakdown")+'</h2></div>'+
        [["images",br.images],["title",br.title],["arabic",br.arabic],["attrs",br.attrs],["reviewFit",br.reviewFit]].map(function(b){ return '<div class="hbar"><span>'+t(b[0])+'</span><span class="tr"><i style="--w:'+b[1]+'%;--c:'+scoreColor(b[1])+'"></i></span><span class="mono">'+b[1]+'</span></div>'; }).join("")+
      '</div>'+
      (p.listing ? kwCard(p.listing) : "")+
      '<div class="card"><div class="card-h"><h2>'+t("insight")+'</h2><small>'+(p.rev ? p.rev+' '+t("fromReviews") : "")+'</small></div>'+(p.themes.length ? "" : '<p class="note">'+t("noReviewsYet")+'</p>')+
        p.themes.map(function(th){ return '<div class="hbar"><span>'+tr(THEMES[th[0]])+'</span><span class="tr"><i style="--w:'+th[1]+'%;--c:'+(th[2] ? "var(--good)" : "var(--bad)")+'"></i></span><span class="mono">'+th[1]+'%</span></div>'; }).join("")+
        '<div style="display:grid;gap:8px;margin-top:12px">'+p.quotes.map(function(q){ return quoteHTML(q, p, false); }).join("")+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function quoteHTML(q, p, link){
  var th = THEMES[q[2]]; var pos = false;
  if (p && p.themes) p.themes.forEach(function(x){ if (x[0] === q[2]) pos = !!x[2]; });
  return '<div class="quote"><q dir="rtl">'+esc(q[0])+'</q><span class="meta"><span>'+t(q[1])+'</span>·<span class="tag'+(p ? (pos ? " good" : " bad") : "")+'">'+tr(th)+'</span>'+(p && link !== false ? '<a href="#listing-'+p.id+'" style="margin-inline-start:auto">'+esc(tr(p.name))+'</a>' : "")+'</span></div>';
}

function vReviews(){
  var all = []; P.forEach(function(p){ p.quotes.forEach(function(q){ all.push([q,p]); }); });
  var list = all.filter(function(x){ return state.dialect === "all" || x[0][1] === state.dialect; });
  var agg = {}; P.forEach(function(p){ p.themes.forEach(function(th){ var a = agg[th[0]] || (agg[th[0]] = {neg:0,pos:0}); a[th[2] ? "pos" : "neg"] += Math.round(th[1]*p.rev/100); }); });
  var keys = Object.keys(agg).sort(function(a,b){ return (agg[b].neg+agg[b].pos)-(agg[a].neg+agg[a].pos); });
  var max = Math.max.apply(null, keys.map(function(k){ return agg[k].neg+agg[k].pos; }));
  return '<div class="head"><div><h1>'+t("reviews")+'</h1><p>'+t("revSub")+'</p></div></div>'+
  analyseCard()+
  '<div class="grid2 even">'+
    '<div class="card"><div class="card-h"><h2>'+t("themes")+'</h2><small><span style="color:var(--bad)">■</span> '+t("negative")+' &nbsp; <span style="color:var(--good)">■</span> '+t("positive")+'</small></div>'+
      keys.map(function(k){ var a = agg[k]; return '<div class="hbar" style="grid-template-columns:140px 1fr 50px"><span>'+tr(THEMES[k])+'</span><span class="tr" style="display:flex;gap:2px;background:transparent"><i style="width:'+(a.neg/max*100)+'%;background:var(--bad);border-radius:9px"></i><i style="width:'+(a.pos/max*100)+'%;background:var(--good);border-radius:9px"></i></span><span class="mono">'+(a.neg+a.pos)+'</span></div>'; }).join("")+
    '</div>'+
    '<div class="card"><div class="card-h"><h2>'+t("quotes")+'</h2></div>'+
      '<div class="chips" role="group" aria-label="'+t("dialect")+'" style="margin-bottom:12px">'+["all","gulf","egy","lev","msa"].map(function(d){ return '<button type="button" class="chip" data-dialect="'+d+'" aria-pressed="'+(state.dialect === d)+'">'+t(d)+'</button>'; }).join("")+'</div>'+
      '<div style="display:grid;gap:8px">'+(list.length ? list.map(function(x){ var key = x[1].id+"|"+x[1].quotes.indexOf(x[0]); return quoteHTML(x[0], x[1])+replyBlock(key); }).join("") : '<p class="empty">'+t("noResults")+'</p>')+'</div>'+
    '</div>'+
  '</div>';
}

/* audit */
function listingFromForm(a){
  var lines = function(v){ return v.split("\n").map(function(x){ return x.trim(); }).filter(Boolean); };
  var images = []; for (var i = 0; i < Math.min(+a.images || 0, 12); i++) images.push(i === 0 ? {width:+a.res || 0, height:+a.res || 0, whiteBackground:a.white} : {width:2000, height:2000});
  var attributes = {}; Object.keys(a.attrs).forEach(function(k){ if (a.attrs[k]) attributes[k] = "yes"; });
  return {channel:a.channel, category:a.category, titleEn:a.titleEn, titleAr:a.titleAr, bulletsEn:lines(a.bulletsEn), bulletsAr:lines(a.bulletsAr), images:images, attributes:attributes, sizeChart:a.sizeChart};
}
function issueDetail(i){
  var d = i.detail || {};
  if (i.key === "attrs" && d.missing) return d.missing.map(function(k){ return t("at_"+k); }).join(" · ");
  if (i.key === "claim" && d.phrase) return "«"+d.phrase+"»";
  if (i.key === "titleTooLong") return d.length+" / "+d.max;
  if (i.key === "keywordStuffing" && d.word) return "«"+d.word+"»";
  if ((i.key === "fewImages" || i.key === "fewBullets") && d.min) return d.count+" / "+d.min;
  return ISSUES[i.key] ? tr(ISSUES[i.key].d) : "";
}
function kwCard(listing){
  var k = keywordCoverage(listing);
  return '<div class="card"><div class="card-h"><h2>'+t("keywords")+'</h2><small class="tnum">'+k.covered+' / '+k.total+'</small></div><p class="note" style="margin-bottom:10px">'+t("kwSub")+'</p><div class="kw">'+
    k.items.map(function(i){ var on = i.inAr || i.inEn; return '<span class="tag'+(on ? " good" : "")+'">'+(on ? "✓ " : "")+'<span dir="rtl">'+esc(i.ar)+'</span> · '+esc(i.en)+'</span>'; }).join("")+'</div></div>';
}
function auditOut(){
  var lf = listingFromForm(state.al), r = auditListing(lf);
  return '<div class="card"><div class="card-h"><h2>'+t("result")+'</h2><small>'+CH[r.channel].n+' · '+t("cat_"+r.category)+'</small></div><div class="lhead">'+ring(r.score)+'<div style="flex:1;min-width:200px">'+
    [["images","images"],["title","title"],["arabic","arabic"],["attrs","attrs"]].map(function(b){ var v = r.breakdown[b[0]]; return '<div class="hbar" style="grid-template-columns:110px 1fr 36px"><span>'+t(b[1])+'</span><span class="tr"><i style="--w:'+v+'%;--c:'+scoreColor(v)+'"></i></span><span class="mono">'+v+'</span></div>'; }).join("")+'</div></div></div>'+
  '<div class="card"><div class="card-h"><h2>'+t("issuesT")+'</h2><small>'+r.issues.length+'</small></div>'+
    (r.issues.length ? r.issues.map(function(i){ var x = ISSUES[i.key] || {t:[i.key,i.key]}; return '<div class="issue" style="--c:'+sevC(i.sev)+'"><span class="sev"></span><div><b>'+tr(x.t)+'</b><p>'+esc(issueDetail(i))+'</p></div>'+sevTag(i.sev)+'</div>'; }).join("") : '<p class="empty">'+t("allGood")+'</p>')+'</div>'+kwCard(lf);
}
function vAudit(){
  var a = state.al, req = REQUIRED_ATTRIBUTES[a.category] || [];
  var opt = function(list, cur, lab){ return list.map(function(v){ return '<option value="'+v+'"'+(v === cur ? " selected" : "")+'>'+lab(v)+'</option>'; }).join(""); };
  return '<div class="head"><div><h1>'+t("audit")+'</h1><p>'+t("auditSub")+'</p></div></div>'+
  '<div class="grid2 audit-grid">'+
    '<form class="card" id="audit-form" style="display:grid;gap:14px" onsubmit="return false">'+
      '<div class="form-grid"><div class="field"><label for="a-channel">'+t("channel")+'</label><select id="a-channel" data-a="channel">'+opt(AUDIT_CHANNELS, a.channel, function(v){ return CH[v].n; })+'</select></div>'+

      br:a.breakdown, issues:a.issues.map(function(i){ return i.key; }), issueDetails:a.issues, themes:[], quotes:[],
      image:it.image || null, url:it.url || null, imported:true, listing:l, newTitle:l.titleEn,
      st:{headAr:first(l.titleAr), headEn:first(l.titleEn), bAr:(l.bulletsAr || []).slice(0,4).join("\n"), bEn:(l.bulletsEn || []).slice(0,4).join("\n"), oAr:"هدية مثالية", oEn:"The perfect gift", kit:0}};
    P.unshift(p); PM[id] = p; n++;
  });
  state.src = "imported"; state.chan = "all";
  return n;
}
function importDone(res, label){
  var n = addImported(res);
  var avg = n ? Math.round(res.items.reduce(function(s, it){ return s + it.audit.score; }, 0) / n) : 0;
  state.imp = {busy:false, error:null, note: tf("importedN", {n:n, s:avg}) + (label ? " · " + label : ""), warnings: res.warnings || [], url: state.imp.url};
  render();
}
function importCsvText(text, name){
  var r = listingsFromCSV(text, {channel:"noon"});
  if (r.error){ state.imp.error = r.error; state.imp.note = null; render(); return; }
  r.items.forEach(function(it){ it.audit = auditListing(it.listing); });
  importDone({items:r.items, warnings: r.truncated ? ["Only the first 500 rows were imported."] : []}, name);
}
function runImport(){
  var url = (state.imp.url || "").trim();
  if (!url || !state.api) return;
  state.imp = {busy:true, url:url}; render();
  fetch("/api/import", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url:url})})
    .then(function(res){ return res.json().then(function(j){ if (!res.ok) throw new Error(j.error || res.status); return j; }); })
    .then(function(j){ importDone(j, (j.source && j.source.platform) || ""); })
    .catch(function(e){ state.imp = {busy:false, error:e.message, url:url}; render(); });
}
function importCard(){
  var im = state.imp, server = !!state.api, c = state.connectors;
  return '<div class="card imp"><div class="card-h"><h2>'+t("importT")+'</h2>'+(c ? '<span class="tag'+(c.amazon.connected ? " good" : "")+'">'+(c.amazon.connected ? t("amazonOn") : t("amazonOff"))+'</span>' : "")+'</div>'+
    '<p class="note">'+t("importSub")+'</p>'+
    '<form id="imp-form" class="imp-row"><input id="imp-url" type="text" inputmode="url" autocomplete="off" aria-label="'+t("importT")+'" placeholder="'+t("importPh")+'" dir="ltr" value="'+esc(im.url || "")+'"><button type="submit" class="btn btn-primary"'+(server && !im.busy ? "" : " disabled")+'>'+(im.busy ? t("importing") : t("importBtn"))+'</button></form>'+
    (server ? "" : '<p class="note">'+t("linkNeedsServer")+'</p>')+
    '<div class="imp-row"><label class="btn btn-ghost btn-sm" for="imp-file">'+t("uploadCsv")+'</label><input type="file" id="imp-file" accept=".csv,text/csv" class="vh"><button type="button" class="btn btn-ghost btn-sm" id="imp-sample">'+t("sampleCsv")+'</button><span class="note">'+t("csvNote")+'</span></div>'+
    (im.error ? '<p class="err" style="margin-top:10px">'+esc(im.error)+'</p>' : "")+
    (im.note ? '<p class="note" style="margin-top:10px;color:var(--good)">'+esc(im.note)+'</p>' : "")+
    ((im.warnings || []).map(function(w){ return '<p class="note">'+esc(w)+'</p>'; }).join(""))+
  '</div>';
}

/* ---------- router ---------- */
function route(){
  var h = (location.hash || "#overview").slice(1), m;
  if ((m = h.match(/^listing-(\w+)$/)) && PM[m[1]]){ state.route = "listing"; state.pid = m[1]; }
  else if ((m = h.match(/^studio-(\w+)$/)) && PM[m[1]]){ if (state.pid !== m[1]) state.slide = 1; state.route = "studio"; state.pid = m[1]; }
  else if (["overview","audit","catalog","reviews","approvals","templates"].indexOf(h) > -1) state.route = h;
  else state.route = "overview";
  render(true);
}
function render(scroll){
  renderSide();
  var r = state.route;
  view.innerHTML = r === "catalog" ? vCatalog() : r === "listing" ? vListing() : r === "studio" ? vStudio() : r === "reviews" ? vReviews() : r === "approvals" ? vApprovals() : r === "audit" ? vAudit() : r === "templates" ? vTemplates() : vOverview();
  hydrate(view);
  document.title = "Basira · " + t(r === "listing" ? "catalog" : r);
  if (scroll) window.scrollTo(0,0);
}
/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var el;
  if ((el = e.target.closest("[data-lang]"))){ setLang(el.dataset.lang); return; }
  if ((el = e.target.closest("tr[data-href]"))){ go(el.dataset.href); return; }
  if ((el = e.target.closest("[data-chan]"))){ state.chan = el.dataset.chan; render(); return; }
  if ((el = e.target.closest("[data-dialect]"))){ state.dialect = el.dataset.dialect; render(); return; }
  if ((el = e.target.closest("a[data-slide]"))){ state.slide = +el.dataset.slide; return; }
  if ((el = e.target.closest(".sitem"))){ state.slide = +el.dataset.slide; render(); return; }
  if ((el = e.target.closest("[data-lm]"))){ state.langMode = el.dataset.lm; render(); return; }
  if ((el = e.target.closest("[data-num]"))){ state.num = el.dataset.num; render(); return; }
  if ((el = e.target.closest("[data-kit]"))){ state.kitBy[state.pid] = +el.dataset.kit; render(); return; }
  if ((el = e.target.closest("[data-src]"))){ state.src = el.dataset.src; render(); return; }
  if ((el = e.target.closest("[data-tgroup]"))){ state.tgroup = el.dataset.tgroup; render(); return; }
  if ((el = e.target.closest("[data-add]"))){ var pa = PM[state.pid], sa = setOf(pa); sa.push({tpl:el.dataset.add, fields:{}}); state.slide = sa.length - 1; if (state.gen[pa.id]) state.gen[pa.id].phase = "idle"; toast(t("added")+" "+tr(pa.name)); go("studio-"+pa.id); return; }
  if ((el = e.target.closest("[data-move]"))){ var sm = setOf(PM[state.pid]), a = state.slide, b = a + (+el.dataset.move); if (b >= 0 && b < sm.length){ var tmp = sm[a]; sm[a] = sm[b]; sm[b] = tmp; state.slide = b; } render(); return; }
  if ((el = e.target.closest("[data-remove]"))){ var sr = setOf(PM[state.pid]); if (sr.length > 1){ sr.splice(+el.dataset.remove, 1); state.slide = Math.max(0, state.slide - 1); } render(); return; }
  if ((el = e.target.closest("#imp-sample"))){ importCsvText(SAMPLE_CSV, "sample-noon-export.csv"); return; }
  if ((el = e.target.closest("[data-reply]"))){ runReply(el.dataset.reply); return; }
  if ((el = e.target.closest("[data-copy]"))){ var rp = state.replies[el.dataset.copy]; if (rp && navigator.clipboard) navigator.clipboard.writeText(rp.text).then(function(){ toast(t("copied")); }, function(){}); return; }
  if ((el = e.target.closest("#gen"))){ runGen(state.pid); return; }
  if ((el = e.target.closest("#send"))){ sendAppr(state.pid); return; }
  if ((el = e.target.closest("#rev-go"))){ runAnalyse(); return; }
  if ((el = e.target.closest("[data-approve]"))){ approve(el.dataset.approve); return; }
  if ((el = e.target.closest("[data-changes]"))){ var it = findQ(el.dataset.changes); it.status = "changes"; render(); toast(t("requested")); return; }
});
document.addEventListener("submit", function(e){ if (e.target.id === "imp-form"){ e.preventDefault(); runImport(); } });
document.addEventListener("error", function(e){ var el = e.target; if (el && el.tagName === "IMG" && el.dataset && el.dataset.fallback != null){ var b = document.createElement("b"); b.className = "ini"; b.textContent = el.dataset.fallback; el.replaceWith(b); } }, true);
document.addEventListener("keydown", function(e){ var el = e.target.closest && e.target.closest("tr[data-href]"); if (el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); go(el.dataset.href); } });
document.addEventListener("input", function(e){
  var el = e.target;
  if (el.id === "q"){ state.q = el.value; if (state.route !== "catalog") go("catalog"); else render(); return; }
  if (el.id === "rev-in"){ state.rev.text = el.value; return; }
  if (el.dataset && (el.dataset.a || el.dataset.attr)){
    if (el.dataset.attr) state.al.attrs[el.dataset.attr] = el.checked;
    else state.al[el.dataset.a] = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.a === "category") { state.al.attrs = {}; render(); return; }
    document.getElementById("audit-out").innerHTML = auditOut(); return;
  }
  if (el.id === "imp-url"){ state.imp.url = el.value; return; }
  if (el.dataset && el.dataset.sf){ var sp = PM[state.pid], ss = setOf(sp)[state.slide]; ss.fields[el.dataset.sf] = el.value; var g = state.gen[state.pid]; if (g && g.phase === "sent") g.phase = "done"; repaint(sp.id, state.slide); }
});
document.addEventListener("change", function(e){
  if (e.target.id === "sort"){ state.sort = e.target.value; render(); }
  if (e.target.id === "pick"){ go("studio-"+e.target.value); }
  if (e.target.id === "pick-t"){ state.pid = e.target.value; render(); }
  if (e.target.id === "imp-file" && e.target.files && e.target.files[0]){
    var cf = e.target.files[0];
    if (cf.size > 10 * 1024 * 1024){ state.imp.error = "The file is larger than 10 MB"; render(); return; }
    var cr = new FileReader(); cr.onload = function(){ importCsvText(String(cr.result), cf.name); }; cr.readAsText(cf);
  }
  if (e.target.id === "f-photo" && e.target.files && e.target.files[0]){
    var file = e.target.files[0], pid = state.pid;
    if (file.size > 8 * 1024 * 1024){ document.getElementById("photo-note").textContent = t("photoTooBig"); return; }
    var fr = new FileReader();
    fr.onload = function(){ state.photos[pid] = fr.result; (state.renders[pid] || []).forEach(function(o){ URL.revokeObjectURL(o.url); }); delete state.renders[pid]; if (state.gen[pid]) state.gen[pid].phase = "idle"; render(); };
    fr.readAsDataURL(file);
  }
});

function ensureDataImage(p){
  var img = imgFor(p);
  if (/^data:/.test(img)) return Promise.resolve(img);
  return fetch("/api/fetch-image", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url: img})})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.dataUrl){ state.photos[p.id] = j.dataUrl; return j.dataUrl; } return symbolDataUrl(p); })
    .catch(function(){ return symbolDataUrl(p); });
}
function runServerGen(pid){
  var p = PM[pid], set = setOf(p).slice(), g = state.gen[pid] = {phase:"run", step:0, server:true}; render();
  var tick = setInterval(function(){ if (g.step < 3){ g.step++; if (state.route === "studio" && state.pid === pid) render(); } }, 350);
  ensureDataImage(p).then(function(image){
    return Promise.all(set.map(function(sl){
      var c = ctxFor(p, sl);
      return fetch("/api/render", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({template:sl.tpl, fields:sl.fields, image:image, language:c.language, numerals:c.numerals, kit:c.kit, brand:c.brand})})
        .then(function(r){ return r.ok ? r.blob() : r.json().then(function(j){ throw new Error(j.error || r.status); }); });
    }));
  }).then(function(blobs){
    (state.renders[pid] || []).forEach(function(o){ URL.revokeObjectURL(o.url); });
    state.renders[pid] = blobs.map(function(b, j){ return {url: URL.createObjectURL(b), tpl: set[j].tpl}; });
    g.step = 4; g.phase = "done";
  }).catch(function(err){ g.phase = "error"; g.error = err.message; })
  .then(function(){ clearInterval(tick); if (state.route === "studio" && state.pid === pid) render(); });
}
function runGen(pid){
  if (state.api && state.api.render) return runServerGen(pid);
  var g = state.gen[pid] = {phase:"run", step:0}; render();
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function next(){
    setTimeout(function(){
      g.step++;
      if (g.step >= 4){ g.phase = "done"; }
      if (state.route === "studio" && state.pid === pid) render();
      if (g.phase === "run") next();
    }, reduce ? 50 : 650);
  })();
}
function sendAppr(pid){
  var g = state.gen[pid]; if (!g || g.phase !== "done") return;
  g.phase = "sent";
  var p = PM[pid], iss = openIssues(p)[0] || p.issues[0];
  state.queue.unshift({id:"q"+Date.now(), pid:pid, by:"Sara", status:"pending", issue:iss});
  render(); toast(t("sent"));
}
function findQ(id){ return state.queue.filter(function(q){ return q.id === id; })[0]; }
function approve(id){
  var it = findQ(id); it.status = "publishing"; render();
  setTimeout(function(){
    it.status = "live"; var p = PM[it.pid]; p.score = p.target; p.fixed = true; p.imgs = Math.max(p.imgs, 4);
    if (state.route === "approvals") render(); else renderSide();
    toast(t("published")+" "+p.ch.map(function(c){ return CH[c].n; }).join(", "));
  }, 1300);
}

function setLang(l){
  state.lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
  document.getElementById("q").placeholder = t("search");
  try { localStorage.setItem("basira-lang", l); } catch(e){}
  render();
}

addEventListener("hashchange", route);
if (/^https?:$/.test(location.protocol)){
  fetch("/api/health").then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if (!j || !j.ok) return;
    state.api = j; render();
    fetch("/api/connectors").then(function(r){ return r.ok ? r.json() : null; }).then(function(c){ if (c){ state.connectors = c; if (state.route === "catalog") render(); } }).catch(function(){});
  }).catch(function(){});
}
var saved = null; try { saved = localStorage.getItem("basira-lang"); } catch(e){}
var initial = saved || ((navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
state.lang = initial; document.documentElement.lang = initial; document.documentElement.dir = initial === "ar" ? "rtl" : "ltr";
document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === initial)); });
document.getElementById("q").placeholder = t("search");
route();
})();
</script>
