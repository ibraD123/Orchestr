<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Approvals</title>
<style>
:root{--bg:#F6F5F1;--surface:#FFFFFF;--line:#E4E1D8;--ink:#17201D;--ink-2:#4A5450;--ink-3:#7D8682;--accent:#1F5C4F;--accent-ink:#fff;--good:#1E7A4F;--good-soft:#E3F2EA;--bad:#B4442E;--bad-soft:#F8E6E1;--warn:#9A6A12;--warn-soft:#F7EED9}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--surface:#1B201E;--line:#2C3330;--ink:#ECEFED;--ink-2:#B7BFBB;--ink-3:#8A938F;--accent:#5FC3AA;--accent-ink:#07130F;--good:#5CC28C;--good-soft:#16302A;--bad:#E5806A;--bad-soft:#3A201A;--warn:#E2B35C;--warn-soft:#352A14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;min-height:64px}
.top img{height:32px;max-width:120px;object-fit:contain}
.top h1{font-size:17px;margin:0;font-weight:600}
.top small{color:var(--ink-3);display:block;font-weight:400;font-size:12.5px}
.lang{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--ink-2);padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--ink-2);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font:inherit;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;margin-inline-start:6px;padding:0 6px}
main{padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}
.note{color:var(--ink-3);font-size:13px;margin:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:12px;margin-top:12px}
@media (max-width:640px){.ba{grid-template-columns:1fr}}
.lbl{font-size:12px;color:var(--ink-3);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{position:relative;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:crosshair}
.shot img{display:block;width:100%;height:auto}
.before .shot{cursor:default;opacity:.85}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin.draft{background:var(--accent);color:var(--accent-ink)}
.pin.done{background:var(--ink-3)}
.copy{font-size:13.5px;color:var(--ink-2);margin-top:10px;display:grid;gap:4px}
.copy b{color:var(--ink)}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
label.f{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.comments{display:grid;gap:8px;margin-top:12px}
.cm{border-inline-start:3px solid var(--line);padding:4px 10px;font-size:13.5px}
.cm.open{border-color:var(--bad)}
.cm small{color:var(--ink-3)}
.drafts{display:grid;gap:6px;margin-top:8px}
.draft{display:flex;gap:8px;align-items:center}
.draft span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--ink-3);padding:40px 16px}
.err{color:var(--bad);font-size:13.5px}
.ok{color:var(--good);font-size:13.5px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><img id="logo" alt="" hidden><div><h1 id="brand">…</h1><small id="agency"></small></div>
    <div class="lang" role="group"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">ع</button></div></div>
  <nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="reviews"></button><button type="button" role="tab" data-tab="requests"></button><button type="button" role="tab" data-tab="report"></button><button type="button" role="tab" data-tab="library"></button><button type="button" role="tab" data-tab="brief"></button></nav>
</div></header>
<main class="wrap" id="main"><p class="empty">…</p></main>
<script>
(function(){
"use strict";
var T = {
  reviews:["For approval","للموافقة"], requests:["Requests","الطلبات"], brief:["Brand questionnaire","استبيان العلامة"],
  by:["Prepared by","من إعداد"], before:["Before","قبل"], after:["After","بعد"], approve:["Approve","موافقة"], changes:["Ask for changes","اطلب تعديلات"],
  comment:["Comment","تعليق"], commentPh:["What should change? You can also tap a spot on an image to pin a comment there.","ما الذي يجب تعديله؟ يمكنك أيضاً النقر على موضع في الصورة لتثبيت تعليق عليه."],
  pinPh:["Comment for this spot","تعليق على هذا الموضع"], removePin:["Remove","إزالة"], send:["Send","إرسال"],
  st_pending:["Waiting for you","بانتظارك"], st_approved:["Approved","تمت الموافقة"], st_changes:["Changes requested","طُلبت تعديلات"],
  resolved:["fixed","تم التعديل"], nothing:["Nothing waits for your approval right now.","لا يوجد ما ينتظر موافقتك الآن."],
  title:["Title","العنوان"], bullets:["Points","النقاط"], sent:["Sent","أُرسل"], thanks:["Thank you, the agency has your answer.","شكراً، وصل ردك إلى الوكالة."],
  reqNew:["New request","طلب جديد"], kind:["What do you need?","ماذا تحتاج؟"], k_season:["Season pack (Ramadan, Eid, National Day, White Friday)","حزمة موسمية (رمضان، العيد، اليوم الوطني، الجمعة البيضاء)"], k_newProducts:["New products to list","منتجات جديدة للإدراج"], k_fix:["Fix existing listings","تعديل منتجات قائمة"], k_other:["Something else","شيء آخر"],
  details:["Details","التفاصيل"], links:["Product links, one per line","روابط المنتجات، رابط في كل سطر"], due:["Needed by","مطلوب بحلول"], yourName:["Your name","اسمك"],
  rs_new:["New","جديد"], rs_inProgress:["In progress","قيد التنفيذ"], rs_done:["Done","تم"], noReq:["No requests yet.","لا طلبات بعد."],
  bIntro:["Tell us about your brand once. Your agency turns this into the rules every image and text follows.","أخبرنا عن علامتك مرة واحدة. تحول الوكالة ذلك إلى قواعد تلتزم بها كل صورة ونص."],
  bName:["Brand name (English)","اسم العلامة (إنجليزي)"], bNameAr:["Brand name (Arabic)","اسم العلامة (عربي)"], bAbout:["What you sell and what makes it different","ماذا تبيع وما الذي يميزه"], bAudience:["Who buys it","من يشتريه"],
  bVoice:["Tone","النبرة"], v_formal:["Formal","رسمية"], v_friendly:["Friendly","ودية"], v_playful:["Playful","مرحة"], v_luxury:["Luxury","فاخرة"],
  bDialect:["Arabic style","أسلوب العربية"], d_gulf:["Gulf","خليجي"], d_msa:["Modern standard","فصحى"], d_egyptian:["Egyptian","مصري"], d_levantine:["Levantine","شامي"],
  bLangs:["Languages on images","اللغات على الصور"], l_both:["Arabic and English","العربية والإنجليزية"], l_ar:["Arabic only","العربية فقط"], l_en:["English only","الإنجليزية فقط"],
  bNums:["Digits in Arabic text","الأرقام في النص العربي"], n_arabic:["Arabic (١٢)","عربية (١٢)"], n_western:["Western (12)","غربية (12)"],
  bColours:["Brand colours (hex, e.g. #2A1A0E)","ألوان العلامة (مثل ‎#2A1A0E)"], bUse:["Words you like to use","كلمات تحب استخدامها"], bAvoid:["Words never to use","كلمات لا تُستخدم أبداً"],
  bClaims:["Claims that need care (health, certificates)","ادعاءات تحتاج حذراً (صحية، شهادات)"], bExamples:["Brands or listings you like, and ones you don't","علامات أو صفحات تعجبك وأخرى لا تعجبك"], bLogo:["Logo (PNG, JPEG, WebP or SVG, up to 1 MB)","الشعار (PNG أو JPEG أو WebP أو SVG حتى 1 ميغابايت)"],
  bSave:["Send to the agency","أرسل إلى الوكالة"], bSaved:["Received. Your agency will apply it to your brand rules.","تم الاستلام. ستطبقه الوكالة على قواعد علامتك."], bApplied:["Applied by the agency","طبقته الوكالة"], choose:["Choose…","اختر…"],
  report:["Report","التقرير"], library:["Library","المكتبة"], who:["Who is answering?","من يجيب؟"], waitLegal:["Waiting for legal approval","بانتظار موافقة الشؤون القانونية"], needsLegal:["Has claims: legal approves too","يتضمن ادعاءات: توافق الشؤون القانونية أيضاً"],
  ro_marketing:["Marketing","التسويق"], ro_legal:["Legal","الشؤون القانونية"], ro_owner:["Owner","المالك"],
  rpMonth:["This month","هذا الشهر"], rpSent:["Sent for approval","أُرسل للموافقة"], rpApproved:["Approved","تمت الموافقة"], rpWaiting:["Waiting for you","بانتظارك"], rpChanges:["Changes requested","طُلبت تعديلات"],
  rpReqOpen:["Requests in work","طلبات قيد العمل"], rpReqDone:["Requests done","طلبات منجزة"], rpPackage:["Monthly package","الباقة الشهرية"], rpUsed:["{used} of {limit} fixes used","استُخدم {used} من {limit} تعديلاً"], rpOver:["{n} over the package","{n} فوق الباقة"], rpRecent:["Recently approved","تمت الموافقة مؤخراً"],
  libEmpty:["Approved images appear here.","تظهر هنا الصور المعتمدة."], download:["Download","تنزيل"],
  err:["Something went wrong:","حدث خطأ:"], gone:["This link isn't valid any more. Ask your agency for a new one.","هذا الرابط لم يعد صالحاً. اطلب رابطاً جديداً من الوكالة."]
};
var token = location.pathname.split("/").pop(), data = null, tab = "reviews", drafts = {}, lang = "en";
try { lang = localStorage.getItem("basira-portal-lang") || ((navigator.language || "").slice(0, 2) === "ar" ? "ar" : "en"); } catch (e) {}
function t(k){ var v = T[k]; return v ? v[lang === "ar" ? 1 : 0] : k; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function api(path, opts){ return fetch("/api/c/" + token + path, opts).then(function(r){ return r.json().then(function(j){ if (!r.ok){ var e = new Error(j.error || r.status); e.status = r.status; throw e; } return j; }); }); }
function send(path, method, body){ return api(path, {method: method, headers: {"Content-Type":"application/json"}, body: JSON.stringify(body)}); }
function name(){ try { return localStorage.getItem("basira-portal-name") || ""; } catch (e) { return ""; } }
function approver(){ try { return localStorage.getItem("basira-portal-approver") || ""; } catch (e) { return ""; } }
function setLang(l){ lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; try { localStorage.setItem("basira-portal-lang", l); } catch (e) {} render(); }
function load(){ return api("").then(function(j){ data = j; render(); }).catch(function(e){ document.getElementById("main").innerHTML = '<p class="empty">' + (e.status === 404 ? t("gone") : esc(t("err") + " " + e.message)) + "</p>"; }); }

function render(){
  document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
  if (!data) return;
  var brand = lang === "ar" && data.brand.nameAr ? data.brand.nameAr : data.brand.name;
  document.getElementById("brand").textContent = brand; document.title = brand + " · " + t("reviews");
  document.getElementById("agency").textContent = data.agency.name ? t("by") + " " + data.agency.name : "";
  var logo = document.getElementById("logo"); if (data.agency.logo){ logo.src = data.agency.logo; logo.hidden = false; }
  if (data.agency.colour && /^#[0-9a-f]{6}$/i.test(data.agency.colour)) document.documentElement.style.setProperty("--accent", data.agency.colour);
  var waiting = data.reviews.reduce(function(n, r){ return n + r.items.filter(function(i){ return i.status === "pending"; }).length; }, 0);
  document.querySelectorAll("[data-tab]").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === tab)); b.innerHTML = esc(t(b.dataset.tab)) + (b.dataset.tab === "reviews" && waiting ? '<span class="badge">' + waiting + "</span>" : ""); });
  var m = document.getElementById("main");
  m.innerHTML = tab === "requests" ? vRequests() : tab === "brief" ? vBrief() : tab === "report" ? vReport() : tab === "library" ? vLibrary() : vReviews();
}

function copyHTML(c){
  if (!c) return "";
  var title = lang === "ar" ? (c.titleAr || c.titleEn) : (c.titleEn || c.titleAr), b = lang === "ar" && c.bulletsAr.length ? c.bulletsAr : c.bulletsEn;
  return '<div class="copy">' + (title ? "<div><b>" + t("title") + ":</b> " + esc(title) + "</div>" : "") + (b && b.length ? "<div><b>" + t("bullets") + ":</b> " + b.map(esc).join(" · ") + "</div>" : "") + "</div>";
}
function vReviews(){
  var items = [];
  data.reviews.forEach(function(r){ r.items.forEach(function(it, i){ items.push({r: r, it: it, i: i}); }); });
  if (!items.length) return '<p class="empty">' + t("nothing") + "</p>";
  var whoSel = data.approvers && data.approvers.length ? '<div class="card"><label class="f">' + t("who") + '<select id="who"><option value="">' + t("choose") + "</option>" + data.approvers.map(function(a){ return '<option value="' + esc(a.id) + '"' + (approver() === a.id ? " selected" : "") + ">" + esc(a.name) + " · " + t("ro_" + a.role) + "</option>"; }).join("") + "</select></label></div>" : "";
  items.sort(function(a, b){ return (a.it.status === "pending" ? 0 : 1) - (b.it.status === "pending" ? 0 : 1); });
  return whoSel + items.map(function(x){
    var it = x.it, k = x.r.id + ":" + x.i, d = drafts[k] || (drafts[k] = {pins: [], text: ""});
    var n = 0, pinsByImg = {};
    it.comments.forEach(function(c){ c.pins.forEach(function(p){ n++; (pinsByImg[p.image] = pinsByImg[p.image] || []).push({x: p.x, y: p.y, n: n, done: c.resolved}); }); });
    d.pins.forEach(function(p, j){ (pinsByImg[p.image] = pinsByImg[p.image] || []).push({x: p.x, y: p.y, n: "+" + (j + 1), draft: true}); });
    var st = it.status === "pending" ? "warn" : it.status === "approved" ? "good" : "bad";
    return '<section class="card" data-k="' + k + '"><div class="row"><h2>' + esc(it.name) + '</h2><span class="tag ' + st + '">' + t(it.waitingOn === "legal" ? "waitLegal" : "st_" + it.status) + "</span>" + (it.needs && it.needs.indexOf("legal") > -1 ? '<span class="tag">' + t("needsLegal") + "</span>" : "") + '<span class="note" style="margin-inline-start:auto">' + esc(x.r.title) + " · " + new Date(x.r.sentAt).toLocaleDateString(lang === "ar" ? "ar" : "en-GB") + "</span></div>" +
      '<div class="ba"><div class="before"><span class="lbl">' + t("before") + "</span>" + (it.before.image ? '<div class="shot"><img src="' + esc(it.before.image) + '" alt=""></div>' : "") + copyHTML(it.before.copy) + "</div>" +
      '<div><span class="lbl">' + t("after") + '</span><div class="imgs">' + it.after.images.map(function(src, j){
        return '<div class="shot" data-img="' + j + '"><img src="' + esc(src) + '" alt="">' + (pinsByImg[j] || []).map(function(p){ return '<span class="pin' + (p.draft ? " draft" : p.done ? " done" : "") + '" style="left:' + (p.x * 100) + "%;top:" + (p.y * 100) + '%">' + p.n + "</span>"; }).join("") + "</div>";
      }).join("") + "</div>" + copyHTML(it.after.copy) + "</div></div>" +
      (it.comments.length ? '<div class="comments">' + it.comments.map(function(c){ return '<div class="cm' + (c.resolved ? "" : " open") + '"><small>' + esc(c.by) + " · " + new Date(c.at).toLocaleString(lang === "ar" ? "ar" : "en-GB") + (c.resolved ? " · " + t("resolved") : "") + "</small><div>" + esc(c.text) + "</div>" + c.pins.map(function(p){ return "<div>📍 " + esc(p.text) + "</div>"; }).join("") + "</div>"; }).join("") + "</div>" : "") +
      (d.pins.length ? '<div class="drafts">' + d.pins.map(function(p, j){ return '<div class="draft"><span>+' + (j + 1) + '</span><input data-pintext="' + k + "|" + j + '" placeholder="' + esc(t("pinPh")) + '" value="' + esc(p.text) + '"><button type="button" class="btn" data-pindel="' + k + "|" + j + '">' + t("removePin") + "</button></div>"; }).join("") + "</div>" : "") +
      '<div style="margin-top:12px"><textarea data-text="' + k + '" placeholder="' + esc(t("commentPh")) + '">' + esc(d.text) + "</textarea></div>" +
      '<div class="row" style="margin-top:10px">' + (it.status === "pending" ? '<button type="button" class="btn primary" data-act="approve|' + k + '">' + t("approve") + '</button><button type="button" class="btn" data-act="changes|' + k + '">' + t("changes") + "</button>" : '<button type="button" class="btn" data-act="comment|' + k + '">' + t("comment") + "</button>") +
        (d.err ? '<span class="err">' + esc(d.err) + "</span>" : d.ok ? '<span class="ok">' + t("thanks") + "</span>" : "") + "</div></section>";
  }).join("");
}

function opt(key, list, cur){ return '<select data-b="' + key + '"><option value="">' + t("choose") + "</option>" + list.map(function(v){ return '<option value="' + v + '"' + (cur === v ? " selected" : "") + ">" + t(v.length > 2 && T[key[0] + "_" + v] ? key[0] + "_" + v : v) + "</option>"; }).join("") + "</select>"; }
function vReport(){
  var r = data.report, stat = function(k, v){ return '<div class="card" style="margin:0"><div class="note">' + t(k) + '</div><div style="font-size:28px;font-weight:700">' + v + "</div></div>"; };
  return '<section class="card"><h2>' + t("rpMonth") + ' <span class="note">' + esc(r.month) + "</span></h2>" +
    '<div class="imgs" style="margin-top:12px">' + stat("rpSent", r.sent) + stat("rpApproved", r.approved) + stat("rpWaiting", r.waiting) + stat("rpChanges", r.changes) + stat("rpReqOpen", r.requestsOpen) + stat("rpReqDone", r.requestsDone) + "</div>" +
    (r.package ? '<div style="margin-top:14px"><span class="lbl">' + t("rpPackage") + '</span><div style="height:10px;border-radius:6px;background:var(--line);overflow:hidden"><i style="display:block;height:100%;width:' + Math.min(100, Math.round(r.package.used / r.package.limit * 100)) + '%;background:var(--accent)"></i></div><p class="note" style="margin-top:6px">' + t("rpUsed").replace("{used}", r.package.used).replace("{limit}", r.package.limit) + (r.package.over ? " · " + t("rpOver").replace("{n}", r.package.over) : "") + "</p></div>" : "") + "</section>" +
    (r.recent.length ? '<section class="card"><h2>' + t("rpRecent") + '</h2><div class="imgs" style="margin-top:10px">' + r.recent.map(function(x){ return '<div><div class="shot" style="cursor:default">' + (x.image ? '<img src="' + esc(x.image) + '" alt="">' : "") + '</div><div class="note" style="margin-top:4px">' + esc(x.name) + "</div></div>"; }).join("") + "</div></section>" : "");
}
function vLibrary(){
  if (!data.library.length) return '<p class="empty">' + t("libEmpty") + "</p>";
  return data.library.map(function(x){ return '<section class="card"><div class="row"><h2>' + esc(x.name) + '</h2><span class="note" style="margin-inline-start:auto">' + new Date(x.at).toLocaleDateString(lang === "ar" ? "ar" : "en-GB") + '</span></div><div class="imgs" style="margin-top:10px">' + x.images.map(function(src, j){ return '<div><div class="shot" style="cursor:default"><img src="' + esc(src) + '" alt=""></div><a class="note" href="' + esc(src) + '" download="product-' + (j + 1) + '">' + t("download") + "</a></div>"; }).join("") + "</div></section>"; }).join("");
}
var req = {kind: "season", text: "", links: "", due: "", msg: null};
function vRequests(){
  return '<section class="card"><h2>' + t("reqNew") + '</h2><div style="display:grid;gap:12px;margin-top:10px">' +
    '<label class="f">' + t("kind") + '<select id="rq-kind">' + ["season","newProducts","fix","other"].map(function(k){ return '<option value="' + k + '"' + (req.kind === k ? " selected" : "") + ">" + t("k_" + k) + "</option>"; }).join("") + "</select></label>" +
    '<label class="f">' + t("details") + '<textarea id="rq-text">' + esc(req.text) + "</textarea></label>" +
    '<div class="grid2"><label class="f">' + t("links") + '<textarea id="rq-links" dir="ltr">' + esc(req.links) + '</textarea></label><div style="display:grid;gap:12px;align-content:start"><label class="f">' + t("due") + '<input id="rq-due" type="date" value="' + esc(req.due) + '"></label><label class="f">' + t("yourName") + '<input id="rq-name" value="' + esc(name()) + '"></label></div></div>' +
    '<div class="row"><button type="button" class="btn primary" id="rq-send">' + t("send") + "</button>" + (req.msg ? '<span class="' + (req.msg.ok ? "ok" : "err") + '">' + esc(req.msg.text) + "</span>" : "") + "</div></div></section>" +
    (data.requests.length ? data.requests.map(function(q){ return '<section class="card"><div class="row"><b>' + t("k_" + q.kind) + '</b><span class="tag ' + (q.status === "done" ? "good" : q.status === "inProgress" ? "warn" : "") + '">' + t("rs_" + q.status) + '</span><span class="note" style="margin-inline-start:auto">' + new Date(q.at).toLocaleDateString(lang === "ar" ? "ar" : "en-GB") + (q.due ? " → " + esc(q.due) : "") + "</span></div>" + (q.text ? '<p style="margin:8px 0 0">' + esc(q.text) + "</p>" : "") + (q.links.length ? '<p class="note" dir="ltr" style="margin-top:6px">' + q.links.map(esc).join("<br>") + "</p>" : "") + "</section>"; }).join("") : '<p class="empty">' + t("noReq") + "</p>");
}
var brief = null, briefMsg = null;
function vBrief(){
  var b = brief || (brief = Object.assign({name: data.brand.name, nameAr: data.brand.nameAr}, data.brief || {}));
  var sel = function(key, list){ return '<label class="f">' + t(key) + '<select data-b="' + ({bVoice:"voice", bDialect:"dialect", bLangs:"languages", bNums:"numerals"})[key] + '"><option value="">' + t("choose") + "</option>" + list.map(function(x){ return '<option value="' + x[0] + '"' + (b[({bVoice:"voice", bDialect:"dialect", bLangs:"languages", bNums:"numerals"})[key]] === x[0] ? " selected" : "") + ">" + t(x[1]) + "</option>"; }).join("") + "</select></label>"; };
  var txt = function(key, field, area, ltr){ var v = b[field]; if (Array.isArray(v)) v = v.join(", "); return '<label class="f">' + t(key) + (area ? '<textarea data-b="' + field + '"' + (ltr ? ' dir="ltr"' : "") + ">" + esc(v || "") + "</textarea>" : '<input data-b="' + field + '"' + (ltr ? ' dir="ltr"' : "") + ' value="' + esc(v || "") + '">') + "</label>"; };
  return '<section class="card"><h2>' + t("brief") + '</h2><p class="note">' + t("bIntro") + "</p>" + (data.brief && data.brief.appliedAt ? '<p><span class="tag good">' + t("bApplied") + "</span></p>" : "") +
    '<div style="display:grid;gap:12px;margin-top:12px"><div class="grid2">' + txt("bName", "name") + txt("bNameAr", "nameAr") + "</div>" + txt("bAbout", "about", true) + txt("bAudience", "audience", true) +
    '<div class="grid2">' + sel("bVoice", [["formal","v_formal"],["friendly","v_friendly"],["playful","v_playful"],["luxury","v_luxury"]]) + sel("bDialect", [["gulf","d_gulf"],["msa","d_msa"],["egyptian","d_egyptian"],["levantine","d_levantine"]]) + sel("bLangs", [["both","l_both"],["ar","l_ar"],["en","l_en"]]) + sel("bNums", [["arabic","n_arabic"],["western","n_western"]]) + "</div>" +
    txt("bColours", "colours", false, true) + '<div class="grid2">' + txt("bUse", "useWords", true) + txt("bAvoid", "avoidWords", true) + "</div>" + txt("bClaims", "claims", true) + txt("bExamples", "examples", true) +
    '<label class="f">' + t("bLogo") + '<input type="file" id="bf-logo" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>' +
    '<div class="row"><button type="button" class="btn primary" id="bf-save">' + t("bSave") + "</button>" + (briefMsg ? '<span class="' + (briefMsg.ok ? "ok" : "err") + '">' + esc(briefMsg.text) + "</span>" : "") + "</div></div></section>";
}

document.addEventListener("click", function(e){
  var el;
  if ((el = e.target.closest("[data-lang]"))) return setLang(el.dataset.lang);
  if ((el = e.target.closest("[data-tab]"))){ tab = el.dataset.tab; return render(); }
  if ((el = e.target.closest(".shot[data-img]"))){
    var card = el.closest("[data-k]"), k = card.dataset.k, r = el.getBoundingClientRect();
    var d = drafts[k] || (drafts[k] = {pins: [], text: ""});
    d.pins.push({image: +el.dataset.img, x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, text: ""});
    render(); var inp = document.querySelector('[data-pintext="' + k + "|" + (d.pins.length - 1) + '"]'); if (inp) inp.focus(); return;
  }
  if ((el = e.target.closest("[data-pindel]"))){ var pd = el.dataset.pindel.split("|"); drafts[pd[0]].pins.splice(+pd[1], 1); return render(); }
  if ((el = e.target.closest("[data-act]"))){
    var a = el.dataset.act.split("|"), key = a[1], parts = key.split(":"), dd = drafts[key] || {pins: [], text: ""};
    dd.err = null; dd.ok = false;
    send("/reviews/" + parts[0] + "/items/" + parts[1], "POST", {decision: a[0], comment: dd.text, pins: dd.pins, name: name(), approver: approver()})
      .then(function(){ drafts[key] = {pins: [], text: "", ok: true}; return load(); })
      .catch(function(err){ dd.err = err.message; render(); });
    return;
  }
  if (e.target.closest("#rq-send")){
    var nm = document.getElementById("rq-name").value.trim(); try { localStorage.setItem("basira-portal-name", nm); } catch (x) {}
    send("/requests", "POST", {kind: req.kind, text: req.text, links: req.links, due: req.due, name: nm})
      .then(function(){ req = {kind: "season", text: "", links: "", due: "", msg: {ok: true, text: t("sent")}}; return load(); })
      .catch(function(err){ req.msg = {ok: false, text: err.message}; render(); });
    return;
  }
  if (e.target.closest("#bf-save")){
    send("/brief", "PUT", brief).then(function(){ briefMsg = {ok: true, text: t("bSaved")}; return load(); }).catch(function(err){ briefMsg = {ok: false, text: err.message}; render(); });
  }
});
document.addEventListener("input", function(e){
  var el = e.target;
  if (el.dataset.text) (drafts[el.dataset.text] = drafts[el.dataset.text] || {pins: [], text: ""}).text = el.value;
  if (el.dataset.pintext){ var p = el.dataset.pintext.split("|"); drafts[p[0]].pins[+p[1]].text = el.value; }
  if (el.id === "rq-text") req.text = el.value; if (el.id === "rq-links") req.links = el.value; if (el.id === "rq-due") req.due = el.value;
  if (el.dataset.b && brief) brief[el.dataset.b] = el.value;
});
document.addEventListener("change", function(e){
  var el = e.target;
  if (el.id === "rq-kind") req.kind = el.value;
  if (el.id === "who"){ try { localStorage.setItem("basira-portal-approver", el.value); } catch (x) {} }
  if (el.dataset.b && brief) brief[el.dataset.b] = el.value;
  if (el.id === "bf-logo" && el.files && el.files[0]){ var fr = new FileReader(); fr.onload = function(){ brief.logo = fr.result; }; fr.readAsDataURL(el.files[0]); }
});
setLang(lang); load();
})();
</script>
</body>
</html>
