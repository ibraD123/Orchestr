# One-click deploy on Render (render.com): New → Blueprint → pick this repository.
services:
  - type: web
    name: basira
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: basira-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SPAPI_CLIENT_ID
        sync: false
      - key: SPAPI_CLIENT_SECRET
        sync: false
      - key: SPAPI_REFRESH_TOKEN
        sync: false
      - key: SPAPI_SELLER_ID
        sync: false
      # The service's public https address (e.g. https://basira.onrender.com): export image links use it.
      - key: PUBLIC_URL
        sync: false
      - key: MOYASAR_SECRET_KEY
        sync: false
      - key: IMAGE_API_URL
        sync: false
      - key: IMAGE_API_KEY
        sync: false
