<title>Basira App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Readex+Pro:wght@300..700&family=Reem+Kufi:wght@500..700&family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell with a quiet sidebar and one working canvas; same oasis palette as the site,
   state carried by chips and score bars so problems read at a glance. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EEEB; --line:#D6DFDA;
  --ink:#0C1A17; --ink-2:#4A5A55; --ink-3:#7A8A85;
  --brand:#0B5D52; --brand-soft:#DAEBE6; --on-brand:#FFFFFF;
  --saffron:#C8771E; --saffron-ink:#94540F; --saffron-soft:#F6E7D3;
  --bad:#B93A26; --bad-soft:#F6E1DC; --good:#1D7A4C; --good-soft:#DBEFE3;
  --side:#0C1A17; --side-ink:#C9D6D1; --side-ink-2:#7F918B; --side-hi:#1A2B27;
  --shadow:0 1px 2px rgba(12,26,23,.06),0 10px 30px -12px rgba(12,26,23,.16);
  --font-display:"Bricolage Grotesque","Readex Pro",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Readex Pro",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1210; --surface:#101B18; --surface-2:#16231F; --line:#22322D;
  --ink:#E7EFEC; --ink-2:#A2B2AC; --ink-3:#71827C;
  --brand:#52C4AE; --brand-soft:#123129; --on-brand:#04120F;
  --saffron:#EBA24C; --saffron-ink:#F2B86B; --saffron-soft:#33230F;
  --bad:#F08A73; --bad-soft:#3A1B15; --good:#62D293; --good-soft:#11301F;
  --side:#060C0B; --side-ink:#C9D6D1; --side-ink-2:#6F817B; --side-hi:#13211D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1210; --surface:#101B18; --surface-2:#16231F; --line:#22322D;
  --ink:#E7EFEC; --ink-2:#A2B2AC; --ink-3:#71827C;
  --brand:#52C4AE; --brand-soft:#123129; --on-brand:#04120F;
  --saffron:#EBA24C; --saffron-ink:#F2B86B; --saffron-soft:#33230F;
  --bad:#F08A73; --bad-soft:#3A1B15; --good:#62D293; --good-soft:#11301F;
  --side:#060C0B; --side-ink:#C9D6D1; --side-ink-2:#6F817B; --side-hi:#13211D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px -14px rgba(0,0,0,.6);
  color-scheme:dark}
html[lang="ar"]{--font-display:"Reem Kufi","Readex Pro",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0;line-height:1.35}
p{margin:0}
.tnum,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.flip{transition:transform .2s}[dir="rtl"] .flip{transform:scaleX(-1)}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh;padding-left:max(14px,env(safe-area-inset-left,0px))}
[dir="rtl"] .side{padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;color:#fff;text-decoration:none}
.brand svg{width:28px;height:28px}
.brand small{font-family:"Readex Pro",sans-serif;font-weight:400;font-size:13px;color:var(--side-ink-2)}
.ws{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side-hi)}
.ws i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7A3E9D,#C0508A);flex:none}
.ws b{display:block;color:#fff;font-weight:500;font-size:14px}
.ws small{color:var(--side-ink-2);font-size:12px}
.navl{display:grid;gap:2px}
.navl a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--side-ink);font-size:14.5px}
.navl a svg{width:18px;height:18px;opacity:.8;flex:none}
.navl a:hover{background:var(--side-hi)}
.navl a[aria-current="page"]{background:var(--side-hi);color:#fff}
.navl a[aria-current="page"] svg{opacity:1;color:var(--saffron)}
.navl .cnt{margin-inline-start:auto;font-size:11.5px;background:var(--saffron);color:#1b1004;border-radius:999px;padding:1px 8px;font-weight:500}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12.5px;color:var(--side-ink-2)}
.credits{background:var(--side-hi);border-radius:12px;padding:12px;display:grid;gap:8px}
.credits .tr{height:6px;border-radius:6px;background:#22332E;overflow:hidden}
.credits .tr i{display:block;height:100%;width:62%;background:var(--saffron)}
.credits b{color:#fff;font-weight:500}
.side-foot a{color:var(--side-ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;height:38px;padding-inline:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;height:28px;min-width:38px;padding-inline:8px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--saffron-soft);color:var(--saffron-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.view{padding:28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:22px;max-width:1320px;width:100%}
.mobile-nav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none}
  .mobile-nav a{flex:none;text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
  .mobile-nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .top{padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .avatar{display:none}
}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:clamp(24px,2.6vw,32px);font-weight:700}
.head p{color:var(--ink-2);margin-top:4px}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);text-decoration:none;font-size:13px;margin-bottom:6px}
.crumb svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-family:var(--font-body);font-weight:600;letter-spacing:0}
.card-h small{color:var(--ink-3);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding-inline:16px;border-radius:10px;border:1px solid transparent;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:filter .15s,background .15s}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:32px;padding-inline:12px;font-size:13px;border-radius:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--saffron-soft);color:var(--saffron-ink)}.tag.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.kpi small{color:var(--ink-3);font-size:12.5px}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi .up{color:var(--good)}
@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
@media (max-width:1050px){.grid2,.grid2.even{grid-template-columns:1fr}}

.pthumb{width:40px;height:48px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.pthumb svg{width:64%;height:auto}
.pcell{display:flex;align-items:center;gap:12px;min-width:0}
.pcell b{display:block;font-weight:500;line-height:1.3}
.pcell small{color:var(--ink-3);font-size:12px;font-family:var(--font-mono)}
.sbar{display:inline-flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-weight:500}
.sbar i{display:block;width:80px;height:6px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.sbar i::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);background:var(--c);border-radius:6px;transition:width .8s}
.list{display:grid}
.row-link{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-decoration:none}
.row-link:first-child{border-top:0}
.row-link:hover{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.hbar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;padding-block:7px;font-size:13.5px}
.hbar .tr{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:9px}
.chan-mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;font-size:11px}
.chans{display:inline-flex;gap:4px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding-inline:12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding-inline:10px;font-size:13px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:780px}
th{font-weight:500;font-size:12px;color:var(--ink-3);text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* listing */
.lhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--c);stroke-linecap:round;stroke-dasharray:213.6;transition:stroke-dashoffset 1s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:26px;font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gimg{aspect-ratio:4/5;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden}
.gimg svg{width:56%}
.gimg.missing{border:1.5px dashed var(--line);background:transparent;color:var(--ink-3);font-size:12px;text-align:center;padding:8px}
.gimg .flag{position:absolute;top:6px;inset-inline-start:6px}
.issue{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.issue{grid-template-columns:4px 1fr;gap:6px 12px}.issue>:last-child{grid-column:2;justify-content:flex-start!important}.issue>.tag{justify-self:start}}
.issue:first-child{border-top:0}
.issue .sev{align-self:stretch;border-radius:4px;background:var(--c)}
.issue b{font-weight:500;display:block}
.issue p{color:var(--ink-2);font-size:13px;margin-top:2px}
.quote{padding:12px 14px;border-radius:12px;background:var(--surface-2);display:grid;gap:6px}
.quote q{quotes:none;direction:rtl;text-align:right;font-size:15px}
.quote q.en{direction:ltr;text-align:left}
.quote .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}

/* studio */
.studio{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:1180px){.studio{grid-template-columns:minmax(0,1fr) 320px}.slist{grid-column:1/-1;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}}
@media (max-width:760px){.studio{grid-template-columns:1fr}}
.slist{display:grid;gap:10px;align-content:start}
.sitem{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start}
.sitem[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sitem .mini{width:52px;aspect-ratio:4/5;border-radius:7px;overflow:hidden}
.sitem b{display:block;font-size:13px;font-weight:500}
.sitem small{font-size:11.5px;color:var(--ink-3)}
@media (max-width:560px){.sitem{grid-template-columns:1fr}.sitem .mini{width:100%}.sitem small{display:none}}
.stage{background:var(--surface-2);border-radius:18px;padding:28px;display:grid;place-items:center;gap:14px;border:1px solid var(--line)}
.canvas{width:min(100%,400px);aspect-ratio:4/5;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);container-type:inline-size}
.canvas .prod{position:absolute;inset:0;display:grid;place-items:center}
.canvas .prod svg{width:46%;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25))}
.canvas .txt{position:absolute;inset-inline:7%;display:grid;gap:2cqw}
.canvas .hd{font-family:"Reem Kufi","Readex Pro",sans-serif;font-size:10.5cqw;line-height:1.15;font-weight:600}
.canvas .hd.en{font-family:"Bricolage Grotesque",sans-serif;font-size:8.5cqw;letter-spacing:-.02em;line-height:1.05;font-weight:700}
.canvas .sub{font-size:4.2cqw;opacity:.85}
.canvas ul{list-style:none;margin:0;padding:0;display:grid;gap:2.4cqw;font-size:4.6cqw}
.canvas ul li{display:flex;gap:2.5cqw;align-items:center}
.canvas ul li::before{content:"";width:2cqw;height:2cqw;transform:rotate(45deg);background:currentColor;flex:none}
.canvas .logo{position:absolute;top:5%;inset-inline-end:6%;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:3.6cqw;letter-spacing:.2em;opacity:.8}
.canvas .scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(82,196,174,.0) 40%,rgba(82,196,174,.35) 50%,transparent 60%);background-size:100% 220%;animation:scan 1.2s linear infinite;pointer-events:none}
@keyframes scan{from{background-position:0 120%}to{background-position:0 -120%}}
.stage-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.canvas .prod img{width:62%;height:70%;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25))}
.sitem .canvas .prod img,.ba .canvas .prod img{filter:none}
.renders{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.renders a{display:grid;gap:6px;text-decoration:none;font-size:12.5px;color:var(--ink-2);justify-items:start}
.renders img{width:100%;aspect-ratio:4/5;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2)}
@media (max-width:560px){.renders{grid-template-columns:1fr 1fr}}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file input{font-size:12.5px;max-width:100%}
.note{font-size:12.5px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.field select{height:38px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding-inline:10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.audit-grid{grid-template-columns:1.1fr 1fr}
.audit-out{display:grid;gap:16px;position:sticky;top:80px;min-width:0}
@media (max-width:1050px){.audit-grid{grid-template-columns:1fr}.audit-out{position:static}}
.dialects{display:flex;flex-wrap:wrap;gap:6px}
.fix{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--brand-soft)}
.fix .ar{direction:rtl;text-align:right}
.pv{display:block;width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2)}
.pv.big{border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.stage-box{position:relative;width:min(100%,420px)}
.stage-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sitem .mini .pv{border-radius:6px}
.tpl-name{display:grid;gap:2px;padding-top:4px;border-top:1px solid var(--line);padding-top:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.tcard{display:grid;gap:10px;align-content:start}
.tcard.dim .pv{opacity:.55}
.tcard .pv{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px -14px rgba(0,0,0,.35)}
.tmeta{display:grid;gap:6px;justify-items:start}

  avoidWord:     { dim: "voice",       check: true },
  noExclamation: { dim: "voice",       check: true },
  noEmoji:       { dim: "voice",       check: true },
  preferWord:    { dim: "voice",       check: false },
  voice:         { dim: "voice",       check: false }
};

const FONT_PAIRS = {
  kufi:   { name: ["Kufi and grotesque", "كوفي وحديث"], ar: "Reem Kufi", latin: "Bricolage Grotesque", body: "Readex Pro" },
  naskh:  { name: ["Classic naskh", "نسخ كلاسيكي"], ar: "Amiri", latin: "Amiri", body: "Readex Pro" },
  modern: { name: ["Modern sans", "حديث بسيط"], ar: "Readex Pro", latin: "Readex Pro", body: "Readex Pro" }
};

const LEARN = {
  promoteSupport: 3,       // consistent positive signals a candidate needs (decay affects confidence, not this count)
  promoteStrength: 0.7,    // and the confidence it needs
  retireStrength: 0.4,     // learned traits below this with contradicting evidence are retired
  halfLifeDays: 120        // learned evidence loses half its weight in this time
};

// Evidence from the brand itself doesn't decay; evidence learned from behaviour does.
const DURABLE = { declared: 1, brandbook: 1, analysis: 1 };
const DAY = 86400000;

/* ---------- text helpers ---------- */

function normaliseWord(s) {
  return String(s || "").toLowerCase()
    .replace(/[ً-ْٰـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
    .replace(/[^\p{L}\p{N}]+/gu, "");
}
const STOP = new Set(["the", "and", "for", "with", "you", "your", "are", "this", "that", "from", "our", "its", "has", "have", "was", "will", "can", "not", "but", "all", "per",
  "في", "من", "علي", "مع", "عن", "الي", "هذا", "هذه", "او", "ما", "لا", "كل", "ان", "قد", "حتي", "التي", "الذي", "هو", "هي", "لك", "لكم", "به", "بها"]);
// Arabic words carry the article and attached prepositions: «الفاخر», «والفاخر», «بالفاخر» are all «فاخر».
const AR_PREFIX = /^(وال|بال|فال|كال|لل|ال)/;
function stem(raw) {
  const w = String(raw || "");
  if (!ARABIC.test(w)) return w;
  const cut = w.replace(/^([وبفك]?)(ال)/, "").replace(/^لل/, "");
  return cut.length >= 3 ? cut : w;
}
function tokens(s) {
  return String(s || "").split(/[^\p{L}\p{N}]+/u).filter(Boolean).map((w) => ({ raw: stem(w), n: normaliseWord(stem(w)) }))
    .filter((w) => w.n.length >= 3 && !STOP.has(w.n) && !/^\d+$/.test(w.n));
}
function hasWord(text, word) {
  const target = normaliseWord(stem(word));
  return tokens(text).some((t) => t.n === target);
}
const EMOJI = /\p{Extended_Pictographic}/u;
const ARABIC = /[؀-ۿ]/;
const WESTERN_DIGIT = /[0-9]/;
const ARABIC_DIGIT = /[٠-٩]/;

/* ---------- colour helpers ---------- */

function hexRgb(hex) {
  const h = String(hex || "").replace("#", "");
  const v = h.length === 3 ? h.split("").map((c) => c + c).join("") : h.slice(0, 6);
  const n = parseInt(v, 16);
  return Number.isFinite(n) ? [(n >> 16) & 255, (n >> 8) & 255, n & 255] : [0, 0, 0];
}
function lab(hex) {
  const lin = (c) => { c /= 255; return c > 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92; };
  const [r, g, b] = hexRgb(hex).map(lin);
  const x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047, y = r * 0.2126 + g * 0.7152 + b * 0.0722, z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
  const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
  return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
}
function colourDistance(a, b) {
  const p = lab(a), q = lab(b);
  return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
}
function luminance(hex) {
  const lin = (c) => { c /= 255; return c > 0.03928 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92; };
  const [r, g, b] = hexRgb(hex).map(lin);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const x = luminance(a), y = luminance(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}

/** Template kit (background, headline colour, secondary text) from a brand palette, with readable contrast. */
function kitFromPalette(palette) {
  const cols = (palette || []).filter((p) => /^#[0-9a-f]{6}$/i.test(p.hex));
  if (!cols.length) return null;
  const pick = (role) => cols.find((p) => p.role === role);
  const bg = (pick("background") || cols.slice().sort((a, b) => luminance(a.hex) - luminance(b.hex))[0]).hex;
  const others = cols.filter((p) => p.hex !== bg);
  const best = (list) => list.slice().sort((a, b) => contrast(b.hex, bg) - contrast(a.hex, bg))[0];
  let fg = (pick("accent") || pick("primary") || best(others) || {}).hex;
  if (!fg || contrast(fg, bg) < 3) fg = luminance(bg) > 0.4 ? "#1A1A1A" : "#FFFFFF";
  let accent = (pick("text") || best(others.filter((p) => p.hex !== fg)) || {}).hex;
  if (!accent || contrast(accent, bg) < 3) accent = luminance(bg) > 0.4 ? "#3A3A3A" : "#EDEDED";
  return { bg, fg, accent };
}

/** Dominant colours from RGBA pixels (logo, product photos): a small k-means, ignoring transparent and near-white/near-black background. */
function extractPalette(d, w, h, k = 5) {
  const pts = [];
  const step = Math.max(1, Math.floor(Math.sqrt((w * h) / 6000)));
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    const i = (y * w + x) * 4;
    if (d[i + 3] < 200) continue;
    pts.push([d[i], d[i + 1], d[i + 2]]);
  }
  if (!pts.length) return [];
  let cs = [];
  for (let j = 0; j < k; j++) cs.push(pts[Math.floor(((j + 0.5) / k) * pts.length)].slice());
  for (let it = 0; it < 8; it++) {
    const sum = cs.map(() => [0, 0, 0, 0]);
    for (const p of pts) {
      let bi = 0, bd = Infinity;
      cs.forEach((c, j) => { const dd = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2; if (dd < bd) { bd = dd; bi = j; } });
      const s = sum[bi]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++;
    }
    cs = sum.map((s, j) => (s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3], s[3]] : cs[j]));
  }
  const hex = (c) => "#" + c.slice(0, 3).map((v) => Math.round(v).toString(16).padStart(2, "0")).join("").toUpperCase();
  const out = [];
  cs.filter((c) => c[3]).sort((a, b) => b[3] - a[3]).forEach((c) => {
    const hx = hex(c);
    if (!out.some((o) => colourDistance(o.hex, hx) < 10)) out.push({ hex: hx, share: Math.round((c[3] / pts.length) * 100) / 100 });
  });
  return out;
}

/* ---------- genome ---------- */

function newGenome(ws, identity) {
  return { ws, version: 1, updatedAt: null, identity: Object.assign({ name: "", nameAr: "", logo: null, logoPos: "top-end", palette: [], fonts: "kufi" }, identity || {}), traits: [], exemplars: [], performance: { templates: {}, fixes: {} }, log: [] };
}

function traitKey(type, params) {
  const p = params || {};
  if (type === "avoidWord" || type === "preferWord") return type + ":" + normaliseWord(stem(p.word));
  if (type === "template") return type + ":" + p.id;
  if (type === "voice" || type === "visual") return type + ":" + normaliseWord(p.text).slice(0, 40);
  return type;
}

/** Human-readable rule, English and Arabic. */
function describe(t) {
  const p = t.params || {};
  switch (t.type) {
    case "palette": return { en: "Use only the brand palette", ar: "استخدم ألوان العلامة فقط" };
    case "logo": return { en: "Show the logo on every slide except the main image", ar: "أظهر الشعار في كل شريحة عدا الصورة الرئيسية" };
    case "textDensity": return { en: `Keep slide text under ${p.maxChars} characters`, ar: `أبقِ نص الشريحة أقل من ${p.maxChars} حرفاً` };
    case "template": return { en: `Don't use the «${p.id}» template` + (t.scope && t.scope.category ? ` for ${t.scope.category.join(", ")}` : ""), ar: `لا تستخدم قالب «${p.id}»` };
    case "bilingual": return { en: p.mode === "both" ? "Arabic and English on every slide" : `Slides in ${p.mode === "ar" ? "Arabic" : "English"} only`, ar: p.mode === "both" ? "العربية والإنجليزية في كل شريحة" : (p.mode === "ar" ? "الشرائح بالعربية فقط" : "الشرائح بالإنجليزية فقط") };
    case "numerals": return { en: p.style === "arabic" ? "Arabic-Indic digits in Arabic text (١٢)" : "Western digits in Arabic text (12)", ar: p.style === "arabic" ? "أرقام عربية في النص العربي (١٢)" : "أرقام لاتينية في النص العربي (12)" };
    case "maxHeadline": return { en: `Headlines of ${p.chars} characters or fewer`, ar: `عناوين لا تتجاوز ${p.chars} حرفاً` };
    case "avoidWord": return { en: `Avoid the word «${p.word}»`, ar: `تجنّب كلمة «${p.word}»` };
    case "preferWord": return { en: `Prefer the word «${p.word}»`, ar: `فضّل كلمة «${p.word}»` };
    case "noExclamation": return { en: "No exclamation marks", ar: "بدون علامات تعجب" };
    case "noEmoji": return { en: "No emoji", ar: "بدون رموز تعبيرية" };
    default: return { en: p.text || "", ar: p.textAr || p.text || "" };
  }
}

function now(at) { return at ? new Date(at).getTime() : Date.now(); }

/** Weighted evidence and Beta-posterior confidence for a trait at a point in time. */
function strength(t, at) {
  const ts = now(at);
  let pos = 0, neg = 0;
  for (const e of t.evidence || []) {
    const age = Math.max(0, (ts - new Date(e.at).getTime()) / DAY);
    const w = (e.w == null ? 1 : e.w) * (DURABLE[e.kind] ? 1 : Math.pow(0.5, age / LEARN.halfLifeDays));
    if (e.sign > 0) pos += w; else neg += w;
  }
  const raw = (t.evidence || []).reduce((a, e) => a + (e.sign > 0 ? (e.w == null ? 1 : e.w) : 0), 0);
  return { pos: Math.round(pos * 100) / 100, neg: Math.round(neg * 100) / 100, raw: Math.round(raw * 100) / 100, s: Math.round(((pos + 1) / (pos + neg + 2)) * 100) / 100 };
}

function evidenceSummary(t) {
  const out = { declared: 0, brandbook: 0, analysis: 0, edit: 0, approve: 0, reject: 0, manual: 0, outcome: 0, against: 0 };
  for (const e of t.evidence || []) { if (e.sign < 0) out.against++; else out[e.kind] = (out[e.kind] || 0) + 1; }
  return out;
}

function logChange(g, entry, at) {
  g.version += 1;
  g.updatedAt = at || new Date().toISOString();
  g.log.unshift(Object.assign({ v: g.version, at: g.updatedAt }, entry));
  if (g.log.length > 200) g.log.length = 200;
}

/** Add evidence to a trait, creating it as a candidate (or active, for declared sources) when new. */
function addEvidence(g, spec, ev, at) {
  const key = traitKey(spec.type, spec.params);
  let t = g.traits.find((x) => x.key === key);
  const changes = [];
  const durable = DURABLE[ev.kind];
  if (!t) {
    if (ev.sign < 0) return changes; // nothing to contradict yet
    t = { id: "t" + (g.traits.length + 1) + "-" + key.replace(/[^a-z0-9]+/gi, "").slice(0, 12), key, type: spec.type, params: Object.assign({}, spec.params),
      scope: spec.scope || {}, origin: durable ? ev.kind : "learned", status: durable || ev.kind === "manual" ? "active" : "candidate", locked: false,
      createdAt: at || new Date().toISOString(), evidence: [] };
    g.traits.push(t);
    changes.push({ type: t.status === "active" ? "added" : "candidate", trait: t.id });
    if (t.status === "active" || (ev.w == null ? 1 : ev.w) >= 1) logChange(g, { type: t.status === "active" ? "added" : "candidate", trait: t.id, note: describe(t).en }, at);
  } else if (spec.params && spec.type === "maxHeadline" && ev.sign > 0) {
    // Learned length limits move towards what people actually keep.
    const n = (t.evidence || []).filter((e) => e.sign > 0).length;
    t.params.chars = Math.round((t.params.chars * n + spec.params.chars) / (n + 1));
  } else if (spec.params && spec.type === "textDensity" && ev.sign > 0) {
    t.params.maxChars = Math.min(t.params.maxChars, spec.params.maxChars);
  }
  const existed = t.evidence.length > 0;
  t.evidence.push(Object.assign({ at: at || new Date().toISOString(), w: 1 }, ev));
  if (existed && t.status === "candidate" && ev.sign > 0) changes.push({ type: "reinforced", trait: t.id });
  if (t.evidence.length > 60) t.evidence.splice(0, t.evidence.length - 60);
  // Selection: promote consistent candidates, retire learned traits that the brand keeps contradicting.
  if (!t.locked) {
    const st = strength(t, at);
    if (t.status === "candidate" && st.raw >= LEARN.promoteSupport && st.s >= LEARN.promoteStrength) {
      t.status = "active"; changes.push({ type: "promoted", trait: t.id });
      logChange(g, { type: "promoted", trait: t.id, note: describe(t).en }, at);
    } else if (t.status === "active" && t.origin === "learned" && st.s < LEARN.retireStrength && st.neg >= 2) {
      t.status = "retired"; changes.push({ type: "retired", trait: t.id });
      logChange(g, { type: "retired", trait: t.id, note: describe(t).en }, at);
    }
  }
  return changes;
}

/** Record a change to the brand's identity (logo, palette, fonts) in the version log. */
function touch(g, note, at) { logChange(g, { type: "identity", note: note || "identity" }, at); }

/** A person decides: accept a candidate, switch a rule off, or bring it back. Locks the trait against automatic changes. */
function setStatus(g, id, status, at) {
  const t = g.traits.find((x) => x.id === id);
  if (!t) return null;
  t.status = status; t.locked = true;
  logChange(g, { type: status === "active" ? "accepted" : status === "off" ? "switched-off" : status, trait: t.id, note: describe(t).en }, at);
  return t;
}

/** Add a rule by hand (or from a brand analysis). */
function declare(g, spec, kind, at, note) {
  // A person's or brand book's word is strong evidence; an AI analysis of materials is weaker.
  const w = kind === "analysis" ? 2 : 6;
  const changes = addEvidence(g, spec, { kind: kind || "manual", sign: 1, w, note: note || "" }, at);
  const t = g.traits.find((x) => x.key === traitKey(spec.type, spec.params));
  if (t && t.status === "candidate") { t.status = "active"; t.locked = kind === "manual"; }
  return { trait: t, changes };
}

/* ---------- observation: turning feedback into evidence ---------- */

/**
 * What an edit says about the brand. before = what Basira proposed, after = what a person kept.
 * Returns trait specs with evidence signs; learn() applies them.
 */
function observeEdit(before, after, ctx) {
  const obs = [];
  const b = String(before || ""), a = String(after || "");
  if (b === a) return obs;
  const tb = tokens(b), ta = tokens(a);
  const setA = new Set(ta.map((t) => t.n)), setB = new Set(tb.map((t) => t.n));
  const kept = tb.filter((t) => setA.has(t.n)).length;
  const overlap = tb.length ? kept / tb.length : 0;
  // Only read word choices from edits, not full rewrites: a rewrite says too little about any one word.
  const removed = [], added = [], seen = new Set();
  for (const t of tb) if (!setA.has(t.n) && !seen.has(t.n)) { seen.add(t.n); removed.push(t); }
  for (const t of ta) if (!setB.has(t.n) && !seen.has(t.n)) { seen.add(t.n); added.push(t); }
  const headline = ctx && (ctx.role === "headline" || ctx.role === "title");
  // Cutting several words from a headline is mostly about length, so those words get little weight;
  // removing or replacing one or two words is a deliberate word choice.
  const trimming = !added.length && removed.length >= 3;
  if (overlap >= 0.3) {
    const w = trimming ? 0.25 : removed.length <= 3 ? 1 : 0.5;
    for (const t of removed) obs.push({ spec: { type: "avoidWord", params: { word: t.raw, lang: ARABIC.test(t.raw) ? "ar" : "en" } }, sign: 1, w, note: `removed «${t.raw}»` });
    for (const t of added) obs.push({ spec: { type: "preferWord", params: { word: t.raw, lang: ARABIC.test(t.raw) ? "ar" : "en" } }, sign: 1, w: 0.5, note: `added «${t.raw}»` });
  }
  // Words a person put back are evidence against avoiding them.
  for (const t of ta) if (!setB.has(t.n)) obs.push({ spec: { type: "avoidWord", params: { word: t.raw } }, sign: -1, note: `used «${t.raw}»` });
  if (/[!！]/.test(b) && !/[!！]/.test(a)) obs.push({ spec: { type: "noExclamation", params: {} }, sign: 1, note: "removed «!»" });
  if (!/[!！]/.test(b) && /[!！]/.test(a)) obs.push({ spec: { type: "noExclamation", params: {} }, sign: -1, note: "added «!»" });
  if (EMOJI.test(b) && !EMOJI.test(a)) obs.push({ spec: { type: "noEmoji", params: {} }, sign: 1, note: "removed emoji" });
  if (headline && a.length && (trimming ? a.length <= b.length * 0.85 : a.length <= b.length * 0.6)) {
    obs.push({ spec: { type: "maxHeadline", params: { chars: Math.ceil(a.length * 1.1) } }, sign: 1, note: `shortened ${b.length} → ${a.length}` });
  }
  if (ARABIC.test(a)) {
    if (WESTERN_DIGIT.test(b) && !WESTERN_DIGIT.test(a) && ARABIC_DIGIT.test(a)) obs.push({ spec: { type: "numerals", params: { style: "arabic" } }, sign: 1, note: "12 → ١٢" });
    if (ARABIC_DIGIT.test(b) && !ARABIC_DIGIT.test(a) && WESTERN_DIGIT.test(a)) obs.push({ spec: { type: "numerals", params: { style: "western" } }, sign: 1, note: "١٢ → 12" });
  }
  return obs;
}

const REJECT_REASONS = ["tooMuchText", "offColours", "logo", "offTone", "productDiffers"];
function observeReject(reasons, ctx) {
  const obs = [];
  for (const r of reasons || []) {
    if (r === "tooMuchText" && ctx && ctx.chars) obs.push({ spec: { type: "textDensity", params: { maxChars: Math.max(20, Math.round(ctx.chars * 0.75)) } }, sign: 1, note: "rejected: too much text" });
    if (r === "offColours") obs.push({ spec: { type: "palette", params: {} }, sign: 1, note: "rejected: off-brand colours" });
    if (r === "logo") obs.push({ spec: { type: "logo", params: { required: true } }, sign: 1, note: "rejected: logo" });
  }
  return obs;
}

/**
 * Apply one feedback event to the genome. Event types:
 *   edit       { before, after, role, ctx }
 *   reject     { reasons[], ctx: { chars, ... } }
 *   approve    { content, ctx }   reinforces active traits the content satisfies, stores an exemplar
 *   removeSlide{ template, ctx }  weak evidence against a template in that category
 *   kit        { onBrand: boolean } choosing colours outside the palette weakens the palette rule
 *   outcome    { result: win | loss | flat, upliftPts, contents[], templates[], fixes[], ctx }
 *              a product's sales result against the control group (see learnOutcome)
 * Returns the list of changes (new candidates, promotions, retirements).
 */
function learn(g, ev) {
  const at = ev.at || new Date().toISOString();
  const ref = { product: ev.product || null, field: ev.field || null };
  let changes = [];
  const apply = (list, kind) => {
    for (const o of list) {
      // Contradicting evidence only touches traits that already exist.
      if (o.sign < 0 && !g.traits.some((t) => t.key === traitKey(o.spec.type, o.spec.params))) continue;
      changes = changes.concat(addEvidence(g, o.spec, { kind, sign: o.sign, w: o.w == null ? 1 : o.w, note: o.note, ref }, at));
    }
  };
  if (ev.type === "edit") apply(observeEdit(ev.before, ev.after, Object.assign({ role: ev.role }, ev.ctx)), "edit");
  else if (ev.type === "reject") apply(observeReject(ev.reasons, ev.ctx), "reject");
  else if (ev.type === "removeSlide" && ev.template) apply([{ spec: { type: "template", params: { id: ev.template, avoid: true }, scope: ev.ctx && ev.ctx.category ? { category: [ev.ctx.category] } : {} }, sign: 1, w: 0.5, note: "slide removed" }], "edit");
  else if (ev.type === "kit" && ev.onBrand === false) apply([{ spec: { type: "palette", params: {} }, sign: -1, w: 0.5, note: "chose colours outside the palette" }], "edit");
  else if (ev.type === "approve" && ev.content) {
    const r = check(g, ev.content, ev.ctx || {}, at);
    for (const res of r.results) if (res.pass && res.trait.status === "active") {
      addEvidence(g, { type: res.trait.type, params: res.trait.params }, { kind: "approve", sign: 1, w: 0.5, note: "approved", ref }, at);
    }
    g.exemplars.unshift({ id: "x" + g.version, at, ctx: ev.ctx || {}, content: ev.exemplar || null, product: ev.product || null, edits: ev.edits || 0 });
    if (g.exemplars.length > 40) g.exemplars.length = 40;
    logChange(g, { type: "approved", note: ev.label || "approved", edits: ev.edits || 0 }, at);
  }
  else if (ev.type === "outcome") changes = learnOutcome(g, ev, at, ref);
  return changes;
}

const round2 = (n) => Math.round(n * 100) / 100;

/**
 * A sales result for one fixed product. A win strengthens every active rule the approved content
 * followed; a loss weakens only rules learned from behaviour (one product's sales don't overrule the
 * brand book). Wins, losses and the conversion change are tallied per slide template and per kind of
 * fix, which is what audit priorities and the brief use. "flat" is recorded but moves no rule.
 */
function learnOutcome(g, ev, at, ref) {
  const perf = g.performance || (g.performance = { templates: {}, fixes: {} });
  const result = ev.result === "win" || ev.result === "loss" ? ev.result : "flat";
  const pts = Number(ev.upliftPts) || 0;

/* photo check */
function loadImg(src){ return new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ rej(new Error("Couldn't read that image")); }; im.src = src; }); }
function canvasFor(im, max){ var sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc)); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return c; }
function analysePhoto(url){
  return loadImg(url).then(function(im){
    var c = canvasFor(im, 500), m = measurePixels(c.getContext("2d").getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    return {width: im.naturalWidth, height: im.naturalHeight, whiteShare: m.whiteShare, fill: m.fill, transparent: m.transparent};
  });
}
function cutout(url, tol){
  return loadImg(url).then(function(im){
    var c = canvasFor(im, 1600), ctx = c.getContext("2d"), data = ctx.getImageData(0, 0, c.width, c.height);
    var m0 = measurePixels(data.data, c.width, c.height);
    if (!m0.transparent) removeBackground(data.data, c.width, c.height, tol || 40);
    ctx.putImageData(data, 0, 0);
    return {canvas: c, box: measurePixels(data.data, c.width, c.height).box};
  });
}

/* ---------- Brand DNA: client workspaces, genome store, learning ---------- */
var STORE_KEY = "basira-store-v2";
var BD = {workspaces:[], genomes:{}, events:{}, serverVer:{}};
(function initStore(){
  var local = null;
  try { local = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch(e){}
  if (local && local.workspaces && local.genomes){
    BD.workspaces = local.workspaces; BD.genomes = local.genomes; BD.events = local.events || {};
    if (local.sets) state.sets = local.sets;
    state.ws = local.ws && local.genomes[local.ws] ? local.ws : local.workspaces[0].id;
  } else {
    var d = sampleData(); BD.workspaces = d.workspaces; BD.genomes = d.genomes; BD.events = d.events; state.ws = "layali";
  }
  if (!PM[state.pid] || PM[state.pid].ws !== state.ws) state.pid = (P.filter(function(p){ return p.ws === state.ws; })[0] || {}).id || null;
})();
function wsInfo(id){ id = id || state.ws; return BD.workspaces.filter(function(w){ return w.id === id; })[0] || BD.workspaces[0]; }
function genome(){ return BD.genomes[state.ws] || (BD.genomes[state.ws] = newGenome(state.ws, {name: wsInfo().name})); }
function wsEvents(){ return BD.events[state.ws] || (BD.events[state.ws] = []); }
function WP(){ return P.filter(function(p){ return (p.ws || "layali") === state.ws; }); }
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({acct: state.me && state.me.account ? state.me.account.id : null, ws: state.ws, workspaces: BD.workspaces, genomes: BD.genomes, events: BD.events, sets: state.sets})); } catch(e){}
}
var saveTimer, pendingEv = {};
function commit(ws, evs){
  ws = ws || state.ws;
  if (evs && evs.length) (pendingEv[ws] = pendingEv[ws] || []).push.apply(pendingEv[ws], evs);
  persist();
  clearTimeout(saveTimer); saveTimer = setTimeout(function(){ pushServer(ws); }, 400);
}
function apiJson(url, opts){
  return fetch(url, opts).then(function(r){ return r.json().then(function(j){ if (!r.ok){ if (r.status === 401 && state.api && state.api.auth && !state.needAuth && url.indexOf("/api/auth/") !== 0) showAuth(); var e = new Error(j.error || r.status); e.status = r.status; throw e; } return j; }); });
}
function pushServer(ws){
  if (!state.api || !state.api.store) return;
  var evs = pendingEv[ws] || []; pendingEv[ws] = [];
  apiJson("/api/brand/"+ws, {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({genome: BD.genomes[ws], baseVersion: BD.serverVer[ws]})})
    .then(function(j){ BD.serverVer[ws] = j.version; })
    .catch(function(e){ if (e.status === 409) reloadFromServer(ws); else toast(e.message); });
  if (evs.length) apiJson("/api/brand/"+ws+"/events", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({events: evs})}).then(function(){ if (evs.some(function(e){ return e.type === "approve"; })) refreshAccount(); }).catch(function(){});
}
function loadFromServer(){
  var shell = document.querySelector(".shell"); shell.classList.add("booting");
  return apiJson("/api/workspaces").then(function(list){
    // An account always has at least one brand to work on.
    if (!list.length) return post("/api/workspaces", {name: (state.me && state.me.account && state.me.account.name) || "My brand"}).then(function(w){ return [w]; });
    return list;
  }).then(function(list){
    state.api.store = true;
    var gs = {}, evs = {}, ver = {};
    return Promise.all(list.map(function(w){
      return Promise.all([apiJson("/api/brand/"+w.id), apiJson("/api/brand/"+w.id+"/events")]).then(function(x){ gs[w.id] = x[0]; ver[w.id] = x[0].version; evs[w.id] = x[1]; });
    })).then(function(){
      // Swap in one step, so nothing renders a half-loaded account.
      BD.workspaces = list; BD.genomes = gs; BD.events = evs; BD.serverVer = ver;
      if (!list.some(function(w){ return w.id === state.ws; })) state.ws = list[0].id;
      if (!PM[state.pid] || PM[state.pid].ws !== state.ws) state.pid = (WP()[0] || {}).id || null;
      persist(); render();
    });
  }).catch(function(){}).then(function(){ shell.classList.remove("booting"); });
}
function reloadFromServer(ws){
  apiJson("/api/brand/"+ws).then(function(g){ BD.genomes[ws] = g; BD.serverVer[ws] = g.version; persist(); render(); toast(t("bdReloaded")); }).catch(function(){});
}

/* every piece of feedback goes through the learner */
function record(ev){
  ev.id = "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  ev.at = ev.at || new Date().toISOString(); ev.ws = state.ws;
  var changes = learn(genome(), ev);
  wsEvents().push(ev);
  return changes;
}
function recordAll(evs){ var all = []; evs.forEach(function(e){ all = all.concat(record(e)); }); commit(state.ws, evs); return all; }
function dsc(x){ var d = describe(x); return [d.en, d.ar]; }
function learnedNote(changes){
  var g = genome(), seen = {};
  // A promotion outranks a reinforcement of the same trait in one batch.
  var rank = {promoted:3, retired:2, candidate:1, reinforced:1}, best = {};
  changes.forEach(function(c){ if (rank[c.type] && (!best[c.trait] || rank[c.type] > rank[best[c.trait].type])) best[c.trait] = c; });
  return Object.keys(best).map(function(k){ var c = best[k], x = g.traits.filter(function(y){ return y.id === c.trait; })[0]; if (!x) return null;
    var raw = strength(x).raw; if ((c.type === "candidate" || c.type === "reinforced") && (raw < 1 || x.status !== "candidate")) return null;
    return {type: c.type === "reinforced" ? "candidate" : c.type, d: dsc(x), n: Math.min(3, Math.round(raw * 100) / 100)}; }).filter(Boolean);
}
function learnedBlock(items){
  return '<div class="learned"><b>'+t("learnedT")+'</b>'+(items && items.length ? items.map(function(i){ return '<div><span class="tag '+(i.type === "promoted" ? "good" : i.type === "retired" ? "bad" : "warn")+'">'+t(i.type === "promoted" ? "learnedPromoted" : i.type === "retired" ? "learnedRetired" : "learnedCandidate")+'</span> '+esc(tr(i.d))+(i.type === "candidate" && i.n ? ' <span class="note">('+tf("bdSignals", {n:i.n})+')</span>' : "")+'</div>'; }).join("") : '<span class="note">'+t("learnedNone")+'</span>')+'</div>';
}
function kindLabel(k){ return t({brandbook:"evBook", declared:"evBook", manual:"evYou", analysis:"evAi", edit:"mem_edit", approve:"mem_approve", reject:"mem_reject"}[k] || "mem_edit"); }
function evText(x){
  var e = evidenceSummary(x), parts = [];
  if (e.brandbook || e.declared) parts.push(t("evBook"));
  if (e.manual) parts.push(t("evYou"));
  if (e.analysis) parts.push(t("evAi"));
  if (e.edit) parts.push(e.edit+" "+t("evEdits"));
  if (e.approve) parts.push(e.approve+" "+t("evApprovals"));
  if (e.reject) parts.push(e.reject+" "+t("evRejects"));
  if (e.outcome) parts.push(e.outcome+" "+t("evSales"));
  if (e.against) parts.push(e.against+" "+t("evAgainst"));
  return parts.join(" · ");
}

function route(){
  var h = (location.hash || "#overview").slice(1), m;
  if ((m = h.match(/^listing-(\w+)$/)) && PM[m[1]]){ state.route = "listing"; state.pid = m[1]; }
  else if ((m = h.match(/^studio-(\w+)$/)) && PM[m[1]]){ if (state.pid !== m[1]) state.slide = 1; state.route = "studio"; state.pid = m[1]; }
  else if (h === "templates" || h === "photos"){ state.cr.tab = h; state.route = "creator"; }
  else if (["overview","audit","catalog","reviews","approvals","creator","brand","batch","results","settings"].indexOf(h) > -1) state.route = h;
  else state.route = "overview";
  render(true);
}
function render(scroll){

  if (state.needAuth){
    shell.classList.add("is-auth"); renderMe();
    view.innerHTML = vAuth();
    document.title = "Basira · " + t(state.authView === "signup" ? "authSignUp" : state.authView === "join" ? "authJoin" : "authSignIn");

  var r = state.route;
  if (!state.pid && (r === "listing" || r === "studio" || r === "templates")) r = "empty";
  view.innerHTML = r === "empty" ? vNoProducts() : r === "creator" ? vCreator() : r === "catalog" ? vCatalog() : r === "listing" ? vListing() : r === "studio" ? vStudio() : r === "reviews" ? vReviews() : r === "approvals" ? vApprovals() : r === "audit" ? vAudit() : r === "templates" ? vTemplates() : r === "photos" ? vPhotos() : r === "brand" ? vBrand() : r === "batch" ? vBatch() : r === "results" ? vResults() : r === "settings" ? vSettings() : vOverview();
  hydrate(view); paintReport();
  document.title = "Basira · " + t(r === "listing" || r === "empty" ? "catalog" : r);
  if (scroll){
    window.scrollTo(0,0);
    view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter");

  var cur = document.querySelector('.mobile-nav a[aria-current="page"]');
  if (cur && cur.parentNode.scrollWidth > cur.parentNode.clientWidth){
    var nav = cur.parentNode, rn = nav.getBoundingClientRect(), rc = cur.getBoundingClientRect();

  if (e.target.dataset && e.target.dataset.palI != null && e.target.dataset.palI !== undefined && e.target.type === "color"){ var gc = genome(); gc.identity.palette[+e.target.dataset.palI].hex = e.target.value.toUpperCase(); touch(gc, "palette"); commit(); render(); }
  if (e.target.dataset && e.target.dataset.palRole != null){ var gr = genome(); gr.identity.palette[+e.target.dataset.palRole].role = e.target.value; touch(gr, "palette"); commit(); render(); }
  if (e.target.id === "bd-fonts" || e.target.id === "bd-logopos"){ var gf = genome(); gf.identity[e.target.id === "bd-fonts" ? "fonts" : "logoPos"] = e.target.value; touch(gf, e.target.id === "bd-fonts" ? "fonts" : "logo position"); commit(); render(); }
  if (e.target.dataset && e.target.dataset.prop != null){ var pp = (state.bd.proposals || [])[+e.target.dataset.prop]; if (pp) pp.on = e.target.checked; }
  if (e.target.id === "ar-type"){ state.bd.ruleType = e.target.value; render(); }
  if (e.target.id === "bp-ch" || e.target.id === "bp-cat"){ state.bd[e.target.id] = e.target.value; render(); }
  if (e.target.id === "bd-logo" && e.target.files && e.target.files[0]){ readLogo(e.target.files[0]); }
  if (e.target.id === "bd-imgs" && e.target.files){ readBrandImages(Array.prototype.slice.call(e.target.files, 0, 6)); }
  if (e.target.id === "bd-pdf" && e.target.files && e.target.files[0]){ var pf = e.target.files[0]; if (pf.size > 20 * 1024 * 1024){ state.bd.error = "The PDF is larger than 20 MB"; render(); return; } var pr2 = new FileReader(); pr2.onload = function(){ state.bd.pdf = String(pr2.result); state.bd.pdfName = pf.name; render(); }; pr2.readAsDataURL(pf); }
  if (e.target.id === "pc-channel"){ state.pc.channel = e.target.value; render(); }
  if (e.target.id === "pc-file" && e.target.files){
    Array.prototype.slice.call(e.target.files, 0, Math.max(0, 4 - state.pc.items.length)).forEach(function(file){
      if (file.size > 15 * 1024 * 1024) return;
      var r2 = new FileReader(); r2.onload = function(){ addPhoto(String(r2.result), file.name.slice(0, 24)).then(render); }; r2.readAsDataURL(file);
    });
  }
  if (e.target.id === "imp-file" && e.target.files && e.target.files[0]){
    var cf = e.target.files[0];
    if (cf.size > 10 * 1024 * 1024){ state.imp.error = "The file is larger than 10 MB"; render(); return; }
    var cr = new FileReader(); cr.onload = function(){ importCsvText(String(cr.result), cf.name); }; cr.readAsText(cf);
  }
  if (e.target.id === "f-photo" && e.target.files && e.target.files[0]){
    var file = e.target.files[0], pid = state.pid;
    if (file.size > 8 * 1024 * 1024){ document.getElementById("photo-note").textContent = t("photoTooBig"); return; }
    var fr = new FileReader();
    fr.onload = function(){ state.photos[pid] = fr.result; (state.renders[pid] || []).forEach(function(o){ URL.revokeObjectURL(o.url); }); delete state.renders[pid]; if (state.gen[pid]) state.gen[pid].phase = "idle"; render(); };
    fr.readAsDataURL(file);
  }
});

function ensureDataImage(p){
  var img = imgFor(p);
  if (/^data:/.test(img)) return Promise.resolve(img);
  return fetch("/api/fetch-image", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url: img})})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.dataUrl){ state.photos[p.id] = j.dataUrl; return j.dataUrl; } return symbolDataUrl(p); })
    .catch(function(){ return symbolDataUrl(p); });
}
function runServerGen(pid){
  var p = PM[pid], set = setOf(p).slice(), g = state.gen[pid] = {phase:"run", step:0, server:true}; render();
  var tick = setInterval(function(){ if (g.step < 3){ g.step++; if (state.route === "studio" && state.pid === pid) render(); } }, 350);
  return ensureDataImage(p).then(function(image){
    return Promise.all(set.map(function(sl){
      var c = ctxFor(p, sl);
      return fetch("/api/render", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({template:sl.tpl, fields:sl.fields, image:image, language:c.language, numerals:c.numerals, kit:c.kit, brand:c.brand, logo:c.logo, fonts:c.fonts})})
        .then(function(r){ return r.ok ? r.blob() : r.json().then(function(j){ throw new Error(j.error || r.status); }); });
    }));
  }).then(function(blobs){
    (state.renders[pid] || []).forEach(function(o){ URL.revokeObjectURL(o.url); });
    state.renders[pid] = blobs.map(function(b, j){ return {url: URL.createObjectURL(b), tpl: set[j].tpl}; });
    g.step = 4; g.phase = "done";
  }).catch(function(err){ g.phase = "error"; g.error = err.message; })
  .then(function(){ clearInterval(tick); if (state.route === "studio" && state.pid === pid) render(); });
}
function runAiGen(pid){
  var p = PM[pid], set = setOf(p).slice(), g = state.gen[pid] = {phase:"run", step:0, server:true}; render();
  var tick = setInterval(function(){ if (g.step < 3){ g.step++; if (state.route === "studio" && state.pid === pid) render(); } }, 900);
  var visual = activeTraits(genome(), {channel:p.ch[0], category:catOf(p)}).filter(function(x){ return x.type === "visual"; }).map(function(x){ return x.params.text; }).join("; ");
  var model = brandModel();
  return ensureDataImage(p).then(function(image){
    var out = [];
    // One slide at a time: each can take several model calls.
    return set.reduce(function(chain, sl){
      return chain.then(function(){
        var c = ctxFor(p, sl);
        return post("/api/slides/generate", {template:sl.tpl, fields:sl.fields, image:image, kit:c.kit, language:c.language, numerals:c.numerals, fonts:c.fonts, logo:c.logo, brand:c.brand, product:tr(p.name), category:catOf(p), visual:visual, modelRef:model || undefined})
          .then(function(r){ return fetch(r.image).then(function(x){ return x.blob(); }).then(function(b){ out.push({url:URL.createObjectURL(b), tpl:sl.tpl, mode:r.mode, reason:r.reason, tries:r.attempts.length, aiPeople:Boolean(r.aiPeople), provider:r.provider || null}); }); });
      });
    }, Promise.resolve()).then(function(){ return out; });
  }).then(function(out){
    (state.renders[pid] || []).forEach(function(o){ URL.revokeObjectURL(o.url); });
    state.renders[pid] = out; g.step = 4; g.phase = "done";
    refreshAccount();
  }).catch(function(err){ g.phase = "error"; g.error = err.message; })
  .then(function(){ clearInterval(tick); if (state.route === "studio" && state.pid === pid) render(); });
}
function runGen(pid){
  if (state.api && state.api.slideGen && state.aiSlides) return runAiGen(pid);
  if (state.api && state.api.render) return runServerGen(pid);
  var g = state.gen[pid] = {phase:"run", step:0}; render();
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function next(){
    setTimeout(function(){
      g.step++;
      if (g.step >= 4){ g.phase = "done"; }
      if (state.route === "studio" && state.pid === pid) render();
      if (g.phase === "run") next();
    }, reduce ? 30 : 220);
  })();
}
function sendAppr(pid){
  var g = state.gen[pid]; if (!g || g.phase !== "done") return;
  g.phase = "sent";
  var p = PM[pid], iss = openIssues(p)[0] || p.issues[0], set = setOf(p), evs = [], maxChars = 0;
  set.forEach(function(sl){
    var tp = templateById(sl.tpl), cur = Object.assign({}, tp.sample, sl.fields);
    tp.fields.forEach(function(fd){
      if (fd.type === "rows") return;
      var b = sl.orig[fd.key], a = cur[fd.key];
      if (b != null && a != null && String(b) !== String(a)) evs.push({type:"edit", product:pid, field: sl.tpl+"."+fd.key, role: /^(head|title|quote)/.test(fd.key) ? "headline" : "body", before:String(b), after:String(a), ctx:{channel:p.ch[0], category:catOf(p), lang: fd.lang || "en", template: sl.tpl}});
    });
    sl.orig = cur;
    maxChars = Math.max(maxChars, slideContent(p, sl).chars);
  });
  var changes = evs.length ? recordAll(evs) : [];
  state.queue.unshift({id:"q"+Date.now(), pid:pid, by:firstName() || "Sara", status:"pending", issue:iss, edits: evs.length, chars: maxChars, learned: learnedNote(changes)});
  persist(); render(); toast(t("sent"));
}
function sendFeedback(id){
  var it = findQ(id), p = PM[it.pid];
  var changes = recordAll([{type:"reject", product:p.id, reasons: it.reasons.slice(), label: t("slidesN"), ctx:{channel:p.ch[0], category:catOf(p), chars: it.chars || 0}}]);
  it.status = "changes"; it.learned = learnedNote(changes); render(); toast(t("requested"));
}
function findQ(id){ return state.queue.filter(function(q){ return q.id === id; })[0]; }
function approve(id){
  var it = findQ(id); if (it.status === "approved") return;
  var p0 = PM[it.pid], set0 = setOf(p0), b0 = set0.filter(function(x){ return x.tpl === "benefit"; })[0] || set0[1] || set0[0];
  var ex0 = b0 ? Object.assign({}, templateById(b0.tpl).sample, b0.fields) : {};
  it.learned = learnedNote(recordAll([{type:"approve", product:p0.id, edits: it.edits || 0, label: set0.length+" "+t("slidesN"), issues: (p0.issues || []).slice(), templates: set0.map(function(x){ return x.tpl; }), content: b0 ? slideContent(p0, b0) : null, exemplar: {template: b0 && b0.tpl, headAr: ex0.headAr, headEn: ex0.headEn}, ctx:{channel:p0.ch[0], category:catOf(p0), lang:"ar", template: b0 && b0.tpl}}]));
  // Approval marks the fix ready; nothing reaches a marketplace until it is exported or published from Bulk fixes.
  it.status = "approved"; p0.fixed = true; p0.score = p0.target; p0.imgs = Math.max(p0.imgs, set0.length);
  render(); toast(t("approvedToast"));
}

function setLang(l){
  state.lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
  document.getElementById("q").placeholder = t("search");
  try { localStorage.setItem("basira-lang", l); } catch(e){}
  render();
}

addEventListener("hashchange", route);
if (/^https?:$/.test(location.protocol)){
  // Hidden until we know whether this is the server and who is signed in, so no sample data flashes first.
  var shellEl = document.querySelector(".shell"), booted = function(){ shellEl.classList.remove("booting"); };
  shellEl.classList.add("booting"); setTimeout(booted, 6000);
  var inviteCode = null; try { inviteCode = new URLSearchParams(location.search).get("invite"); } catch(e){}
  fetch("/api/health").then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if (!j || !j.ok){ booted(); return; }
    state.api = j;
    return apiJson("/api/auth/me").then(function(me){
      useAccount(me);
      if (inviteCode && me.auth) toast(t("inviteSignedIn"));
      startServer();
    }, function(e){
      if (e.status !== 401){ startServer(); return; }
      if (inviteCode){
        state.authView = "join"; state.invite = {code: inviteCode, info: null};
        apiJson("/api/auth/invite?code="+encodeURIComponent(inviteCode)).then(function(info){ state.invite.info = info; if (info.account) state.authForm.type = info.account.type; render(); }).catch(function(){ state.invite.info = {valid:false}; render(); });
      }
      showAuth(); booted();
    });
  }).catch(booted);
}
var saved = null; try { saved = localStorage.getItem("basira-lang"); } catch(e){}
var initial = saved || ((navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
state.lang = initial; document.documentElement.lang = initial; document.documentElement.dir = initial === "ar" ? "rtl" : "ltr";
document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === initial)); });
document.getElementById("q").placeholder = t("search");
route();
})();
</script>
